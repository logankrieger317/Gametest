<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gem Rush — Idle Miner</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: #2a2140; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
  #game { position: fixed; inset: 0; touch-action: none; display: block; }

  #hud {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: calc(10px + env(safe-area-inset-top)) 14px 10px;
    pointer-events: none; z-index: 10;
  }
  #title {
    color: #fff; font-weight: 800; font-size: 18px;
    text-shadow: 0 2px 6px rgba(0,0,0,.5);
  }
  #mineLabel {
    display: block; font-size: 12px; font-weight: 700; color: #cdbdf5;
    text-shadow: 0 1px 3px rgba(0,0,0,.6);
  }
  #coinbox {
    display: flex; align-items: center; gap: 8px;
    background: rgba(20, 12, 40, .75); border: 2px solid #f5b92b;
    border-radius: 999px; padding: 6px 16px 6px 10px;
    box-shadow: 0 4px 14px rgba(0,0,0,.4);
    transition: transform .1s;
  }
  #coinbox.pop { transform: scale(1.15); }
  #coinicon { width: 26px; height: 26px; }
  #coins { color: #ffd95e; font-weight: 800; font-size: 20px; min-width: 40px; text-align: right; font-variant-numeric: tabular-nums; }

  #shop {
    position: fixed; left: 0; right: 0; bottom: 0;
    display: flex; gap: 10px; justify-content: center;
    padding: 10px 12px calc(12px + env(safe-area-inset-bottom));
    z-index: 10;
  }
  .buy {
    flex: 1; max-width: 150px;
    border: none; border-radius: 16px; padding: 10px 6px 9px;
    background: linear-gradient(#8a5cf5, #6a3fd8);
    box-shadow: 0 5px 0 #4c2b9e, 0 8px 18px rgba(0,0,0,.45);
    color: #fff; font-weight: 800; font-size: 14px;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    cursor: pointer; user-select: none;
    transition: transform .08s, filter .15s;
  }
  .buy:active { transform: translateY(3px); box-shadow: 0 2px 0 #4c2b9e, 0 4px 10px rgba(0,0,0,.45); }
  .buy .big { font-size: 15px; letter-spacing: .3px; }
  .buy .lvl { font-size: 11px; opacity: .85; font-weight: 700; }
  .buy .cost { font-size: 13px; color: #ffd95e; display: flex; align-items: center; gap: 4px; font-variant-numeric: tabular-nums; }
  .buy .cost svg { width: 14px; height: 14px; }
  .buy:disabled { filter: grayscale(.75) brightness(.75); cursor: default; }
  .buy:disabled:active { transform: none; box-shadow: 0 5px 0 #4c2b9e, 0 8px 18px rgba(0,0,0,.45); }

  #toast {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: rgba(20, 12, 40, .92); border: 2px solid #f5b92b; border-radius: 20px;
    color: #fff; padding: 22px 30px; text-align: center; z-index: 20;
    box-shadow: 0 10px 40px rgba(0,0,0,.6); display: none;
  }
  #toast h2 { color: #ffd95e; margin-bottom: 8px; font-size: 22px; }
  #toast p { font-size: 16px; margin-bottom: 14px; }
  #toast button {
    border: none; border-radius: 12px; padding: 10px 26px;
    background: linear-gradient(#ffd95e, #f5a623); color: #4a2c00;
    font-weight: 800; font-size: 16px; cursor: pointer;
    box-shadow: 0 4px 0 #b97a10;
  }
  #hint {
    position: fixed; bottom: 92px; left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,.85); font-size: 14px; font-weight: 600;
    background: rgba(20,12,40,.6); padding: 6px 14px; border-radius: 999px;
    pointer-events: none; z-index: 9; transition: opacity 1s;
  }
</style>
</head>

<script>
'use strict';

// ============================== Setup ==============================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, scale = 1, offX = 0, offY = 0;

// World is a fixed portrait play-space, letterboxed into the screen.
const WORLD_W = 820, WORLD_H = 1150;

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  scale = Math.min(W / WORLD_W, H / WORLD_H);
  offX = (W - WORLD_W * scale) / 2;
  offY = (H - WORLD_H * scale) / 2;
}
window.addEventListener('resize', resize);
resize();

function toWorld(px, py) { return { x: (px - offX) / scale, y: (py - offY) / scale }; }

// ============================== Audio ==============================
let actx = null;
function sound(freq, dur, type = 'sine', vol = 0.15, slide = 0) {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), actx.currentTime + dur);
    g.gain.setValueAtTime(vol, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur);
  } catch (e) { /* audio unavailable */ }
}
const sfx = {
  pickup(n) { sound(500 + n * 60, 0.12, 'sine', 0.12); },
  sell()    { sound(700, 0.15, 'triangle', 0.18, 500); setTimeout(() => sound(950, 0.18, 'triangle', 0.15, 400), 70); },
  buy()     { sound(400, 0.12, 'square', 0.08, 200); setTimeout(() => sound(600, 0.15, 'square', 0.08, 250), 80); },
  unlock()  { [520, 660, 780, 1040].forEach((f, i) => setTimeout(() => sound(f, 0.25, 'triangle', 0.15), i * 90)); },
  chest()   { [660, 880, 1100].forEach((f, i) => setTimeout(() => sound(f, 0.2, 'sine', 0.15), i * 60)); },
  deny()    { sound(160, 0.2, 'sawtooth', 0.07, -60); },
};

// ============================== State ==============================
const state = {
  coins: 0,
  miners: 1,
  speedLv: 1,
  valueLv: 1,
  level: 1,
  unlocked: [true, false, false, false],
  lastSeen: Date.now(),
};

const SAVE_KEY = 'gemrush_save_v2';
function save() {
  state.lastSeen = Date.now();
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (e) {}
}
function load() {
  try {
    let raw = localStorage.getItem(SAVE_KEY);
    if (!raw) {
      // migrate v1 saves (single mine, unlocked was an object keyed by ore id)
      const old = localStorage.getItem('gemrush_save_v1');
      if (!old) return;
      const o = JSON.parse(old);
      state.coins = o.coins || 0;
      state.miners = Math.max(1, o.miners || 1);
      state.speedLv = Math.max(1, o.speedLv || 1);
      state.valueLv = Math.max(1, o.valueLv || 1);
      if (o.unlocked) state.unlocked = [true, !!o.unlocked.gold, !!o.unlocked.ruby, !!o.unlocked.rainbow];
      state.lastSeen = o.lastSeen || Date.now();
      return;
    }
    const s = JSON.parse(raw);
    state.coins = s.coins || 0;
    state.miners = Math.max(1, s.miners || 1);
    state.speedLv = Math.max(1, s.speedLv || 1);
    state.valueLv = Math.max(1, s.valueLv || 1);
    state.level = Math.min(Math.max(1, s.level || 1), LEVELS.length);
    if (Array.isArray(s.unlocked) && s.unlocked.length === 4) state.unlocked = s.unlocked.map(Boolean);
    state.unlocked[0] = true;
    state.lastSeen = s.lastSeen || Date.now();
  } catch (e) {}
}

const minerCost = () => Math.floor(50 * Math.pow(1.65, state.miners - 1));
const speedCost = () => Math.floor(30 * Math.pow(1.6, state.speedLv - 1));
const valueCost = () => Math.floor(40 * Math.pow(1.6, state.valueLv - 1));
const speedMult = () => 1 + (state.speedLv - 1) * 0.22;
const valueMult = () => 1 + (state.valueLv - 1) * 0.5;

function fmt(n) {
  if (n >= 1e15) return (n / 1e15).toFixed(1) + 'Q';
  if (n >= 1e12) return (n / 1e12).toFixed(1) + 'T';
  if (n >= 1e9) return (n / 1e9).toFixed(1) + 'B';
  if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
  if (n >= 1e4) return (n / 1e3).toFixed(1) + 'K';
  return Math.floor(n).toString();
}

// ============================== Levels ==============================

// numbers grow. Clearing all 4 opens the NEXT MINE portal in the pit center.

const BASE_COSTS  = [0, 150, 1200, 9000];
const NEXT_MINE_BASE = 30000;
const MINE_SCALE = 25;

function currentLevel() { return LEVELS[Math.min(state.level, LEVELS.length) - 1]; }
function levelMult() { return Math.pow(MINE_SCALE, state.level - 1); }
function nextMineCost() { return Math.round(NEXT_MINE_BASE * levelMult()); }
function allUnlocked() { return state.unlocked.every(u => u); }

// ============================== World objects ==============================
// Ore patches for the current mine. Locked ones show a gate with a price.
let patches = [];
let layout = LAYOUTS[0];
function loadLevel() {
  const L = currentLevel(), m = levelMult();
  layout = LAYOUTS[(state.level - 1) % LAYOUTS.length];
  patches = layout.ores.map((pos, i) => Object.assign({}, pos, L.ores[i], {
    idx: i,
    value: BASE_VALUES[i] * m,
    cost: Math.round(BASE_COSTS[i] * m),
    gems: [], spawnT: 0,
  }));
  sellPad = { x: layout.sell.x, y: layout.sell.y, w: 190, h: 84 };
  buildRocks();
  chest = null;
  for (const mn of miners) {
    mn.x = sellPad.x + (Math.random() - 0.5) * 100;
    mn.y = sellPad.y - 60;
    mn.state = 'toOre'; mn.target = null; mn.route = null; mn.load = 0;
  }
  document.getElementById('mineLabel').textContent =
    '⛏ Mine ' + state.level + '/' + LEVELS.length + ' — ' + L.name;
}

// Waypoint navigation along the layout's road graph
function nearestNode(x, y) {
  let bi = 0, bd = Infinity;
  layout.nodes.forEach((n, i) => {
    const d = Math.hypot(n.x - x, n.y - y);
    if (d < bd) { bd = d; bi = i; }
  });
  return bi;
}
function findRoute(fx, fy, tx, ty) {
  const nf = nearestNode(fx, fy), nt = nearestNode(tx, ty);
  if (nf === nt) return [{ x: tx, y: ty }];
  const prev = new Array(layout.nodes.length).fill(-1);
  prev[nf] = nf;
  const q = [nf];
  while (q.length) {
    const u = q.shift();
    if (u === nt) break;
    for (const [a, b] of layout.edges) {
      const v = a === u ? b : b === u ? a : -1;
      if (v >= 0 && prev[v] === -1) { prev[v] = u; q.push(v); }
    }
  }
  if (prev[nt] === -1) return [{ x: tx, y: ty }];
  const pts = [];
  let cur = nt;
  while (cur !== nf) { pts.push(layout.nodes[cur]); cur = prev[cur]; }
  pts.reverse();
  // jitter waypoints so miners spread across the road instead of single-filing
  const route = pts.map(p => ({ x: p.x + (Math.random() - 0.5) * 48, y: p.y + (Math.random() - 0.5) * 48 }));
  route.push({ x: tx, y: ty });
  return route;
}
function followRoute(m, spd, dt) {
  if (!m.route || !m.route.length) return true;
  const p = m.route[0];
  if (moveToward(m, p.x, p.y, spd, dt)) m.route.shift();
  return m.route.length === 0;
}

let sellPad = { x: 400, y: 900, w: 190, h: 84 };

// Decorative rocks walling in the chambers, with gaps where roads pass
const rocks = [];
function distToSeg(px, py, a, b) {
  const dx = b.x - a.x, dy = b.y - a.y;
  const L2 = dx * dx + dy * dy || 1;
  let t = ((px - a.x) * dx + (py - a.y) * dy) / L2;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (a.x + dx * t), py - (a.y + dy * t));
}
function buildRocks() {
  rocks.length = 0;
  const segs = layout.edges.map(([a, b]) => [layout.nodes[a], layout.nodes[b]]);
  layout.chambers.forEach((ch, ci) => {
    const per = Math.max(14, Math.round((ch.rx + ch.ry) / 26));
    for (let i = 0; i < per; i++) {
      const a = (i / per) * Math.PI * 2 + (i % 3) * 0.05 + ci * 0.4;
      const wob = 0.98 + ((i * 37 + ci * 11) % 10) / 60;
      const x = ch.x + Math.cos(a) * (ch.rx + 26) * wob;
      const y = ch.y + Math.sin(a) * (ch.ry + 26) * wob;
      if (segs.some(([p, q]) => distToSeg(x, y, p, q) < 88)) continue;
      if (layout.chambers.some(c => c !== ch &&
          ((x - c.x) / c.rx) ** 2 + ((y - c.y) / c.ry) ** 2 < 1)) continue;
      rocks.push({ x, y, r: 40 + ((i * 53 + ci * 17) % 26), shade: (i * 29) % 3 });
    }
  });
}

// Miners (little bulldozers)
const miners = [];
function addMinerEntity(i) {
  miners.push({
    x: sellPad.x + (Math.random() - 0.5) * 120,
    y: sellPad.y - 60 + (Math.random() - 0.5) * 40,
    angle: -Math.PI / 2,
    state: 'toOre', t: 0, target: null,
    load: 0, hue: (i * 47) % 360, bob: Math.random() * 6,
  });
}

// FX
const particles = [];  // {x,y,vx,vy,life,color,size,grav}
const floaters = [];   // {x,y,text,life,color,size}
const flyCoins = [];   // coins arcing to the HUD counter

let chest = null;      // {x,y,t,life}
let chestTimer = 20;   // first chest fairly soon
let shake = 0;
let tapCombo = 0, tapComboT = 0;

function burst(x, y, color, n = 10, spread = 3.4) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = 1 + Math.random() * spread;
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 2, life: 0.7 + Math.random() * 0.4, color, size: 3 + Math.random() * 4, grav: 9 });
  }
}
function floatText(x, y, text, color = '#ffd95e', size = 26) {
  floaters.push({ x, y, text, life: 1.1, color, size });
}
function coinFly(x, y, n) {
  for (let i = 0; i < Math.min(n, 8); i++) {
    flyCoins.push({ x: x + (Math.random() - 0.5) * 40, y: y + (Math.random() - 0.5) * 20, t: 0, delay: i * 0.06 });
  }
}

// ============================== Game logic ==============================
function unlockedPatches() { return patches.filter(p => state.unlocked[p.idx]); }

function addCoins(n) {
  state.coins += n;
  const box = document.getElementById('coinbox');
  box.classList.remove('pop'); void box.offsetWidth; box.classList.add('pop');
}

function updatePatches(dt) {
  for (const p of patches) {
    if (!state.unlocked[p.idx]) continue;
    p.spawnT -= dt;
    if (p.spawnT <= 0 && p.gems.length < 26) {
      p.spawnT = 0.5 + Math.random() * 0.7;
      const a = Math.random() * Math.PI * 2, d = p.r * (0.35 + Math.random() * 0.85);
      p.gems.push({ x: p.x + Math.cos(a) * d, y: p.y + Math.sin(a) * d * 0.75 + 18, phase: Math.random() * 6.28 });
    }
  }
}

function updateMiners(dt) {
  while (miners.length < state.miners) addMinerEntity(miners.length);
  const spd = 190 * speedMult();

  for (const m of miners) {
    m.bob += dt * 10;
    if (m.state === 'toOre') {
      if (!m.target || !patches.includes(m.target) || !state.unlocked[m.target.idx]) {
        const ups = unlockedPatches();
        m.target = ups[Math.floor(Math.random() * ups.length)];
        m.dest = { x: m.target.x + (Math.random() - 0.5) * m.target.r, y: m.target.y + 30 + Math.random() * 30 };
        m.route = findRoute(m.x, m.y, m.dest.x, m.dest.y);
      }
      if (followRoute(m, spd, dt)) { m.state = 'mine'; m.t = 1.4 / speedMult(); }
    } else if (m.state === 'mine') {
      m.t -= dt;
      if (Math.random() < dt * 14) {
        particles.push({ x: m.x + (Math.random() - 0.5) * 30, y: m.y + (Math.random() - 0.5) * 16, vx: (Math.random() - 0.5) * 2, vy: -1 - Math.random() * 2, life: 0.5, color: m.target.spark, size: 2 + Math.random() * 3, grav: 4 });
      }
      if (m.t <= 0) {
        m.load = Math.round(m.target.value * (3 + state.speedLv) * valueMult());
        m.loadColor = m.target.color;
        // eat a couple of the visible loose gems so the pile churns
        m.target.gems.splice(0, 2);
        m.state = 'toSell';
        m.route = null;
      }
    } else if (m.state === 'toSell') {
      if (!m.route) m.route = findRoute(m.x, m.y, sellPad.x + (Math.random() - 0.5) * 30, sellPad.y - 10);
      if (followRoute(m, spd, dt)) { m.state = 'sell'; m.t = 0.35; }
    } else if (m.state === 'sell') {
      m.t -= dt;
      if (m.t <= 0) {
        addCoins(m.load);
        floatText(m.x, m.y - 50, '+' + fmt(m.load));
        coinFly(m.x, m.y - 30, Math.ceil(m.load / 10));
        burst(m.x, m.y - 10, '#ffd95e', 8, 2.5);
        sfx.sell();
        m.load = 0; m.state = 'toOre'; m.target = null; m.route = null;
      }
    }
  }
}

function moveToward(m, tx, ty, spd, dt) {
  const dx = tx - m.x, dy = ty - m.y;
  const d = Math.hypot(dx, dy);
  if (d < 6) return true;
  const step = Math.min(d, spd * dt);
  m.x += (dx / d) * step; m.y += (dy / d) * step;
  const want = Math.atan2(dy, dx);
  let da = want - m.angle;
  while (da > Math.PI) da -= Math.PI * 2;
  while (da < -Math.PI) da += Math.PI * 2;
  m.angle += da * Math.min(1, dt * 8);
  return false;
}

function updateChest(dt) {
  if (chest) {
    chest.t += dt; chest.life -= dt;
    if (chest.life <= 0) chest = null;
  } else {
    chestTimer -= dt;
    if (chestTimer <= 0) {
      chestTimer = 35 + Math.random() * 30;
      const ch = layout.chambers[Math.floor(Math.random() * layout.chambers.length)];
      chest = { x: ch.x + (Math.random() - 0.5) * ch.rx * 0.9,
                y: ch.y + (Math.random() - 0.5) * ch.ry * 0.9, t: 0, life: 14 };
    }
  }
}

function updateFX(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt; p.x += p.vx * 60 * dt * 0.06 * 16; p.y += p.vy * 60 * dt * 0.06 * 16;
    p.vy += p.grav * dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (let i = floaters.length - 1; i >= 0; i--) {
    const f = floaters[i];
    f.life -= dt; f.y -= 45 * dt;
    if (f.life <= 0) floaters.splice(i, 1);
  }
  for (let i = flyCoins.length - 1; i >= 0; i--) {
    const c = flyCoins[i];
    if (c.delay > 0) { c.delay -= dt; continue; }
    c.t += dt * 1.8;
    if (c.t >= 1) flyCoins.splice(i, 1);
  }
  if (shake > 0) shake = Math.max(0, shake - dt * 30);
  if (tapComboT > 0) { tapComboT -= dt; if (tapComboT <= 0) tapCombo = 0; }
}

// ============================== Input ==============================
function onTap(px, py) {
  const w = toWorld(px, py);

  // Chest?
  if (chest && Math.hypot(w.x - chest.x, w.y - chest.y) < 70) {
    const ups = unlockedPatches();
    const avgVal = ups.reduce((s, p) => s + p.value, 0) / ups.length;
    const reward = Math.max(25, Math.round(avgVal * (15 + state.miners * 8) * valueMult() * 2));
    addCoins(reward);
    floatText(chest.x, chest.y - 60, '+' + fmt(reward), '#ffd95e', 34);
    burst(chest.x, chest.y, '#ffd95e', 26, 5);
    burst(chest.x, chest.y, '#fff3c4', 14, 4);
    coinFly(chest.x, chest.y, 8);
    sfx.chest();
    shake = 6;
    chest = null;
    return;
  }

  // Next-mine portal?
  const gpos = layout.gate;
  if (allUnlocked() && state.level < LEVELS.length &&
      Math.hypot(w.x - gpos.x, w.y - gpos.y) < 95) {
    const c = nextMineCost();
    if (state.coins >= c) {
      state.coins -= c;
      state.level++;
      state.unlocked = [true, false, false, false];
      loadLevel();
      const g2 = layout.gate;
      burst(g2.x, g2.y, '#ffd95e', 40, 6);
      burst(g2.x, g2.y, '#ffffff', 20, 5);
      floatText(g2.x, g2.y - 60, 'Mine ' + state.level + ': ' + currentLevel().name + '!', '#ffffff', 32);
      sfx.unlock();
      shake = 12;
      save();
    } else {
      floatText(gpos.x, gpos.y - 60, 'Need ' + fmt(c - state.coins) + ' more!', '#ff8080', 24);
      sfx.deny();
    }
    return;
  }

  // Gate?
  for (const p of patches) {
    if (state.unlocked[p.idx]) continue;
    if (Math.hypot(w.x - p.x, w.y - (p.y + 40)) < 100) {
      if (state.coins >= p.cost) {
        state.coins -= p.cost;
        state.unlocked[p.idx] = true;
        burst(p.x, p.y, p.color, 30, 5);
        burst(p.x, p.y, '#ffffff', 16, 4);
        floatText(p.x, p.y - 40, p.name + ' unlocked!', '#ffffff', 30);
        sfx.unlock();
        shake = 8;
        save();
      } else {
        floatText(p.x, p.y - 40, 'Need ' + fmt(p.cost - state.coins) + ' more!', '#ff8080', 24);
        sfx.deny();
      }
      return;
    }
  }

  // Loose gems — generous radius, collect the whole cluster under your thumb.
  let got = 0, gotValue = 0, gx = 0, gy = 0, col = '#fff';
  for (const p of patches) {
    if (!state.unlocked[p.idx]) continue;
    for (let i = p.gems.length - 1; i >= 0; i--) {
      const g = p.gems[i];
      if (Math.hypot(w.x - g.x, w.y - g.y) < 64) {
        got++; gotValue += p.value * valueMult();
        gx += g.x; gy += g.y; col = p.color;
        particles.push({ x: g.x, y: g.y, vx: (Math.random() - 0.5) * 3, vy: -3, life: 0.5, color: p.spark, size: 4, grav: 8 });
        p.gems.splice(i, 1);
      }
    }
  }
  if (got > 0) {
    tapCombo++; tapComboT = 1.2;
    const bonus = 1 + Math.min(tapCombo, 10) * 0.1;
    const total = Math.max(1, Math.round(gotValue * bonus));
    addCoins(total);
    gx /= got; gy /= got;
    floatText(gx, gy - 30, '+' + fmt(total) + (tapCombo >= 3 ? '  x' + tapCombo : ''), '#ffd95e', 24 + Math.min(tapCombo, 8));
    burst(gx, gy, col, 6 + got, 3);
    sfx.pickup(Math.min(tapCombo, 8));
    save();
  }
}

canvas.addEventListener('pointerdown', e => { e.preventDefault(); onTap(e.clientX, e.clientY); });

// ============================== Shop ==============================
const $ = id => document.getElementById(id);
const MAX_MINERS = 15, MAX_SPEED = 25;
function bindBuy(btnId, getCost, apply, isMaxed) {
  $(btnId).addEventListener('click', () => {
    if (isMaxed && isMaxed()) { sfx.deny(); return; }
    const c = getCost();
    if (state.coins < c) { sfx.deny(); return; }
    state.coins -= c;
    apply();
    sfx.buy();
    save();
    refreshShop();
  });
}
bindBuy('buyMiner', minerCost, () => { state.miners++; floatText(400, 760, '+1 Miner!', '#a8ff9e', 30); }, () => state.miners >= MAX_MINERS);
bindBuy('buySpeed', speedCost, () => { state.speedLv++; floatText(400, 760, 'Faster!', '#9edbff', 30); }, () => state.speedLv >= MAX_SPEED);
bindBuy('buyValue', valueCost, () => { state.valueLv++; floatText(400, 760, 'Gems worth more!', '#ffd95e', 30); });

function refreshShop() {
  const mMax = state.miners >= MAX_MINERS, sMax = state.speedLv >= MAX_SPEED;
  $('minerLvl').textContent = 'x' + state.miners;
  $('speedLvl').textContent = 'Lv ' + state.speedLv;
  $('valueLvl').textContent = 'Lv ' + state.valueLv;
  $('minerCost').textContent = mMax ? 'MAX' : fmt(minerCost());
  $('speedCost').textContent = sMax ? 'MAX' : fmt(speedCost());
  $('valueCost').textContent = fmt(valueCost());
  $('buyMiner').disabled = mMax || state.coins < minerCost();
  $('buySpeed').disabled = sMax || state.coins < speedCost();
  $('buyValue').disabled = state.coins < valueCost();
}

// ============================== Rendering ==============================
function draw(t) {
  ctx.clearRect(0, 0, W, H);

  // Background (themed per mine)
  const theme = currentLevel();
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, theme.bg[0]); bg.addColorStop(1, theme.bg[1]);
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

  ctx.save();
  let sx = 0, sy = 0;
  if (shake > 0) { sx = (Math.random() - 0.5) * shake; sy = (Math.random() - 0.5) * shake; }
  ctx.translate(offX + sx, offY + sy);
  ctx.scale(scale, scale);

  drawPit();
  drawSellPad(t);
  drawNextGate(t);
  for (const p of patches) drawPatch(p, t);
  if (chest) drawChest(t);
  drawMiners(t);
  drawParticles();
  drawFloaters();

  ctx.restore();
  drawFlyCoins();
}

function drawPit() {
  const theme = currentLevel();
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const roadSegs = layout.edges.map(([a, b]) => [layout.nodes[a], layout.nodes[b]]);

  // dark floor base: chambers + connecting roads
  ctx.fillStyle = theme.floor[0];
  for (const ch of layout.chambers) {
    ctx.beginPath(); ctx.ellipse(ch.x, ch.y, ch.rx, ch.ry, 0, 0, Math.PI * 2); ctx.fill();
  }
  ctx.strokeStyle = theme.floor[0]; ctx.lineWidth = 150;
  for (const [p, q] of roadSegs) {
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.stroke();
  }
  // lighter inner floor
  ctx.fillStyle = theme.floor[1];
  for (const ch of layout.chambers) {
    ctx.beginPath();
    ctx.ellipse(ch.x, ch.y - 8, Math.max(60, ch.rx - 34), Math.max(50, ch.ry - 34), 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.strokeStyle = theme.floor[1]; ctx.lineWidth = 104;
  for (const [p, q] of roadSegs) {
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.stroke();
  }
  // subtle speckle
  ctx.fillStyle = 'rgba(40,35,55,0.18)';
  layout.chambers.forEach((ch, ci) => {
    for (let i = 0; i < 18; i++) {
      const a = i * 2.4 + ci;
      const dx = Math.cos(a) * ch.rx * 0.7 * (((i * 97 + ci * 31) % 100) / 100);
      const dy = Math.sin(a) * ch.ry * 0.7 * (((i * 53 + ci * 13) % 100) / 100);
      ctx.beginPath(); ctx.arc(ch.x + dx, ch.y + dy, 2 + (i % 4), 0, Math.PI * 2); ctx.fill();
    }
  });
  // rocks
  const shades = theme.rockLight;
  const darks  = theme.rockDark;
  for (const r of rocks) {
    ctx.fillStyle = darks[r.shade];
    ctx.beginPath(); ctx.ellipse(r.x, r.y + 8, r.r, r.r * 0.85, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = shades[r.shade];
    ctx.beginPath(); ctx.ellipse(r.x - r.r * 0.12, r.y - r.r * 0.12, r.r * 0.9, r.r * 0.75, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.beginPath(); ctx.ellipse(r.x - r.r * 0.3, r.y - r.r * 0.35, r.r * 0.35, r.r * 0.25, -0.4, 0, Math.PI * 2); ctx.fill();
  }
}

function drawSellPad(t) {
  const pulse = 1 + Math.sin(t * 3) * 0.03;
  ctx.save();
  ctx.translate(sellPad.x, sellPad.y);
  ctx.scale(pulse, pulse);
  ctx.fillStyle = '#4c2b9e';
  rounded(-sellPad.w / 2, -sellPad.h / 2 + 6, sellPad.w, sellPad.h, 18); ctx.fill();
  ctx.fillStyle = '#6a3fd8';
  rounded(-sellPad.w / 2, -sellPad.h / 2, sellPad.w, sellPad.h, 18); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = '900 40px Segoe UI, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('SELL', 0, 2);
  ctx.restore();
}

function drawNextGate(t) {
  if (!allUnlocked()) return;
  const g = layout.gate;

  if (state.level >= LEVELS.length) {
    // final mine cleared — trophy badge, nothing left to buy
    const bob = Math.sin(t * 2) * 4;
    ctx.font = '900 44px Segoe UI, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('👑', g.x, g.y - 26 + bob);
    ctx.font = '900 24px Segoe UI, sans-serif';
    ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(30,18,55,0.85)';
    ctx.strokeText('ALL MINES CLEARED!', g.x, g.y + 22 + bob);
    ctx.fillStyle = '#ffd95e';
    ctx.fillText('ALL MINES CLEARED!', g.x, g.y + 22 + bob);
    return;
  }

  const afford = state.coins >= nextMineCost();
  const pulse = 1 + Math.sin(t * 4) * 0.05;

  // glowing portal ring
  ctx.save();
  ctx.translate(g.x, g.y - 20);
  ctx.scale(pulse, pulse);
  const glow = ctx.createRadialGradient(0, 0, 10, 0, 0, 80);
  glow.addColorStop(0, afford ? 'rgba(255,217,94,0.55)' : 'rgba(180,160,220,0.35)');
  glow.addColorStop(1, 'rgba(255,217,94,0)');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(0, 0, 80, 0, Math.PI * 2); ctx.fill();
  ctx.lineWidth = 7;
  ctx.strokeStyle = afford ? '#ffd95e' : '#9c8fc4';
  ctx.beginPath(); ctx.ellipse(0, 6, 58, 34, 0, 0, Math.PI * 2); ctx.stroke();
  // swirl sparkles
  for (let i = 0; i < 5; i++) {
    const a = t * 2.2 + i * 1.26;
    ctx.fillStyle = 'rgba(255,255,255,' + (0.4 + Math.sin(a * 3) * 0.3) + ')';
    star(Math.cos(a) * 44, 6 + Math.sin(a) * 24, 5); ctx.fill();
  }
  ctx.fillStyle = '#fff';
  ctx.font = '900 22px Segoe UI, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(30,18,55,0.85)';
  ctx.strokeText('NEXT MINE', 0, -46);
  ctx.fillText('NEXT MINE', 0, -46);
  ctx.restore();

  // price tag
  ctx.save();
  ctx.translate(g.x, g.y + 46);
  ctx.fillStyle = afford ? '#6a3fd8' : '#514266';
  rounded(-80, -22, 160, 44, 12); ctx.fill();
  if (afford) {
    ctx.strokeStyle = 'rgba(255,217,94,' + (0.5 + Math.sin(t * 5) * 0.4) + ')';
    ctx.lineWidth = 3;
    rounded(-80, -22, 160, 44, 12); ctx.stroke();
  }
  ctx.fillStyle = '#fff';
  ctx.font = '900 26px Segoe UI, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(fmt(nextMineCost()), 0, 1);
  ctx.restore();
}

function drawPatch(p, t) {
  const unlocked = state.unlocked[p.idx];

  // ore mound
  ctx.globalAlpha = unlocked ? 1 : 0.55;
  const blobs = [[0, -0.12, 1], [-0.55, 0.15, 0.62], [0.55, 0.18, 0.66], [-0.2, 0.4, 0.5], [0.25, 0.42, 0.48]];
  for (const [ox, oy, s] of blobs) {
    ctx.fillStyle = p.moundDark;
    ctx.beginPath(); ctx.ellipse(p.x + ox * p.r, p.y + oy * p.r + 8, p.r * s, p.r * s * 0.7, 0, 0, Math.PI * 2); ctx.fill();
  }
  for (const [ox, oy, s] of blobs) {
    ctx.fillStyle = p.mound;
    ctx.beginPath(); ctx.ellipse(p.x + ox * p.r - 3, p.y + oy * p.r + 2, p.r * s * 0.92, p.r * s * 0.62, 0, 0, Math.PI * 2); ctx.fill();
  }
  // glints on the mound
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  for (let i = 0; i < 8; i++) {
    const a = i * 0.8 + t * 0.3, d = p.r * 0.55;
    const tw = (Math.sin(t * 4 + i * 2) + 1) / 2;
    ctx.globalAlpha = (unlocked ? 0.6 : 0.25) * tw;
    ctx.beginPath(); ctx.arc(p.x + Math.cos(a) * d, p.y + Math.sin(a) * d * 0.6 - 4, 3, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  if (unlocked) {
    // loose tappable gems
    for (const g of p.gems) {
      const bob = Math.sin(t * 3 + g.phase) * 3;
      ctx.fillStyle = 'rgba(0,0,0,0.18)';
      ctx.beginPath(); ctx.ellipse(g.x, g.y + 6, 7, 3.5, 0, 0, Math.PI * 2); ctx.fill();
      drawGem(g.x, g.y + bob - 4, 9, p.color, p.spark);
      const tw = (Math.sin(t * 5 + g.phase * 3) + 1) / 2;
      if (tw > 0.75) {
        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        star(g.x + 6, g.y + bob - 10, 4); ctx.fill();
      }
    }
  } else {
    // gate: pillars + shimmer + lock + price tag
    const gy = p.y + 40;
    ctx.fillStyle = '#3d2a6e';
    rounded(p.x - 86, gy - 100, 22, 110, 6); ctx.fill();
    rounded(p.x + 64, gy - 100, 22, 110, 6); ctx.fill();
    ctx.fillStyle = '#5b3fa8';
    rounded(p.x - 92, gy - 112, 34, 20, 6); ctx.fill();
    rounded(p.x + 58, gy - 112, 34, 20, 6); ctx.fill();
    const shimmer = ctx.createLinearGradient(p.x, gy - 100, p.x, gy + 8);
    shimmer.addColorStop(0, 'rgba(216,180,254,0.15)');
    shimmer.addColorStop(0.5, 'rgba(216,180,254,0.5)');
    shimmer.addColorStop(1, 'rgba(216,180,254,0.2)');
    ctx.fillStyle = shimmer;
    ctx.fillRect(p.x - 64, gy - 100, 128, 108);
    // lock
    const lb = Math.sin(t * 2.5) * 3;
    ctx.fillStyle = '#2b1d52';
    rounded(p.x - 26, gy - 64 + lb, 52, 42, 10); ctx.fill();
    ctx.fillStyle = '#ffd95e';
    rounded(p.x - 22, gy - 60 + lb, 44, 34, 8); ctx.fill();
    ctx.strokeStyle = '#ffd95e'; ctx.lineWidth = 8;
    ctx.beginPath(); ctx.arc(p.x, gy - 62 + lb, 14, Math.PI, 0); ctx.stroke();
    ctx.fillStyle = '#8a6400';
    ctx.beginPath(); ctx.arc(p.x, gy - 46 + lb, 6, 0, Math.PI * 2); ctx.fill();
    // price tag
    const afford = state.coins >= p.cost;
    ctx.save();
    ctx.translate(p.x, gy + 34);
    ctx.rotate(-0.06);
    ctx.fillStyle = afford ? '#6a3fd8' : '#514266';
    rounded(-72, -22, 144, 44, 12); ctx.fill();
    if (afford) {
      ctx.strokeStyle = 'rgba(255,217,94,' + (0.5 + Math.sin(t * 5) * 0.4) + ')';
      ctx.lineWidth = 3;
      rounded(-72, -22, 144, 44, 12); ctx.stroke();
    }
    ctx.fillStyle = '#fff';
    ctx.font = '900 28px Segoe UI, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(fmt(p.cost), 0, 1);
    ctx.restore();
  }
}

function drawGem(x, y, s, color, spark) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x, y - s);
  ctx.lineTo(x + s * 0.85, y - s * 0.2);
  ctx.lineTo(x + s * 0.5, y + s * 0.8);
  ctx.lineTo(x - s * 0.5, y + s * 0.8);
  ctx.lineTo(x - s * 0.85, y - s * 0.2);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = spark;
  ctx.globalAlpha = 0.75;
  ctx.beginPath();
  ctx.moveTo(x, y - s * 0.75);
  ctx.lineTo(x + s * 0.4, y - s * 0.15);
  ctx.lineTo(x, y + s * 0.25);
  ctx.lineTo(x - s * 0.4, y - s * 0.15);
  ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 1;
}

function star(x, y, s) {
  ctx.beginPath();
  ctx.moveTo(x, y - s);
  ctx.quadraticCurveTo(x + s * 0.2, y - s * 0.2, x + s, y);
  ctx.quadraticCurveTo(x + s * 0.2, y + s * 0.2, x, y + s);
  ctx.quadraticCurveTo(x - s * 0.2, y + s * 0.2, x - s, y);
  ctx.quadraticCurveTo(x - s * 0.2, y - s * 0.2, x, y - s);
  ctx.closePath();
}

function drawChest(t) {
  const bounce = Math.abs(Math.sin(chest.t * 4)) * 10;
  const blink = chest.life < 4 && Math.sin(chest.t * 12) > 0;
  ctx.save();
  ctx.translate(chest.x, chest.y - bounce);
  ctx.globalAlpha = blink ? 0.5 : 1;
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath(); ctx.ellipse(0, 34 + bounce, 46, 14, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#b8860b';
  rounded(-44, -6, 88, 42, 10); ctx.fill();
  ctx.fillStyle = '#e6394f';
  rounded(-44, -30, 88, 30, 12); ctx.fill();
  ctx.fillStyle = '#ffd95e';
  rounded(-44, -8, 88, 8, 3); ctx.fill();
  rounded(-8, -30, 16, 44, 4); ctx.fill();
  ctx.fillStyle = '#fff3c4';
  ctx.beginPath(); ctx.arc(0, -2, 5, 0, Math.PI * 2); ctx.fill();
  // sparkles
  for (let i = 0; i < 3; i++) {
    const a = t * 3 + i * 2.1;
    ctx.fillStyle = 'rgba(255,255,255,' + (0.5 + Math.sin(a * 2) * 0.4) + ')';
    star(Math.cos(a) * 55, -38 + Math.sin(a * 1.3) * 12, 5); ctx.fill();
  }
  ctx.restore();
}

function drawMiners(t) {
  const sorted = [...miners].sort((a, b) => a.y - b.y);
  for (const m of sorted) {
    const bob = Math.sin(m.bob) * (m.state === 'mine' ? 2.5 : 1);
    ctx.save();
    ctx.translate(m.x, m.y + bob);
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath(); ctx.ellipse(0, 14 - bob, 30, 11, 0, 0, Math.PI * 2); ctx.fill();
    ctx.rotate(m.angle + Math.PI / 2);
    // treads
    ctx.fillStyle = '#3a3344';
    rounded(-24, -20, 10, 44, 5); ctx.fill();
    rounded(14, -20, 10, 44, 5); ctx.fill();
    // body
    ctx.fillStyle = 'hsl(' + m.hue + ', 75%, 55%)';
    rounded(-17, -18, 34, 38, 8); ctx.fill();
    ctx.fillStyle = 'hsl(' + m.hue + ', 75%, 68%)';
    rounded(-13, -14, 26, 18, 6); ctx.fill();
    // blade
    ctx.fillStyle = '#cfd2dd';
    rounded(-22, -30, 44, 9, 4); ctx.fill();
    // cab window
    ctx.fillStyle = '#bfe8ff';
    rounded(-9, 2, 18, 12, 4); ctx.fill();
    // carried load
    if (m.load > 0) {
      ctx.fillStyle = m.loadColor;
      ctx.beginPath(); ctx.ellipse(0, -26, 16, 9, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.beginPath(); ctx.ellipse(-4, -28, 6, 3, 0, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 1.6));
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawFloaters() {
  for (const f of floaters) {
    ctx.globalAlpha = Math.max(0, Math.min(1, f.life * 1.5));
    ctx.font = '900 ' + f.size + 'px Segoe UI, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(30,18,55,0.85)';
    ctx.strokeText(f.text, f.x, f.y);
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
}

function drawFlyCoins() {
  // screen-space: arc from world point to the HUD coin counter
  const box = document.getElementById('coinbox').getBoundingClientRect();
  const tx = box.left + box.width / 2, ty = box.top + box.height / 2;
  for (const c of flyCoins) {
    if (c.delay > 0) continue;
    const sx0 = offX + c.x * scale, sy0 = offY + c.y * scale;
    const k = c.t, ease = k * k * (3 - 2 * k);
    const x = sx0 + (tx - sx0) * ease;
    const y = sy0 + (ty - sy0) * ease - Math.sin(k * Math.PI) * 90;
    ctx.fillStyle = '#f5b92b';
    ctx.beginPath(); ctx.arc(x, y, 9, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffd95e';
    ctx.beginPath(); ctx.arc(x, y, 6, 0, Math.PI * 2); ctx.fill();
  }
}

function rounded(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// ============================== Offline earnings ==============================
function offlineEarnings() {
  const away = (Date.now() - state.lastSeen) / 1000;
  if (away < 120) return;
  const capped = Math.min(away, 8 * 3600);
  const avgValue = unlockedPatches().reduce((s, p) => s + p.value, 0) / unlockedPatches().length;
  const cycle = (1.4 + 5.5) / speedMult(); // rough mine + travel time
  const rate = state.miners * avgValue * (3 + state.speedLv) * valueMult() / cycle;
  const earned = Math.floor(rate * capped * 0.4);
  if (earned < 1) return;
  const mins = Math.floor(away / 60);
  document.getElementById('toastMsg').textContent =
    'Your miners kept digging for ' + (mins >= 60 ? Math.floor(mins / 60) + 'h ' + (mins % 60) + 'm' : mins + 'm') + ' and earned:  🪙 ' + fmt(earned);
  const toast = document.getElementById('toast');
  toast.style.display = 'block';
  document.getElementById('toastBtn').onclick = () => {
    addCoins(earned);
    toast.style.display = 'none';
    sfx.chest();
    save();
  };
}

// ============================== Main loop ==============================
load();
loadLevel();
offlineEarnings();
refreshShop();

let last = performance.now();
let hudTimer = 0, saveTimer = 0, hintTimer = 12;

function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  const t = now / 1000;

  updatePatches(dt);
  updateMiners(dt);
  updateChest(dt);
  updateFX(dt);

  hudTimer -= dt;
  if (hudTimer <= 0) {
    hudTimer = 0.15;
    document.getElementById('coins').textContent = fmt(state.coins);
    refreshShop();
  }
  saveTimer -= dt;
  if (saveTimer <= 0) { saveTimer = 5; save(); }
  if (hintTimer > 0) {
    hintTimer -= dt;
    if (hintTimer <= 0) document.getElementById('hint').style.opacity = '0';
  }

  draw(t);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

window.addEventListener('beforeunload', save);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
</script>
