<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gem Rush — Idle Miner</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: #2a2140; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
  #game { position: fixed; inset: 0; touch-action: none; display: block; }

  #hud {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: calc(10px + env(safe-area-inset-top)) 14px 10px;
    pointer-events: none; z-index: 10;
  }
  #title {
    color: #fff; font-weight: 800; font-size: 18px;
    text-shadow: 0 2px 6px rgba(0,0,0,.5);
  }
  #mineLabel {
    display: block; font-size: 12px; font-weight: 700; color: #cdbdf5;
    text-shadow: 0 1px 3px rgba(0,0,0,.6);
  }
  #coinbox {
    display: flex; align-items: center; gap: 8px;
    background: rgba(20, 12, 40, .75); border: 2px solid #f5b92b;
    border-radius: 999px; padding: 6px 16px 6px 10px;
    box-shadow: 0 4px 14px rgba(0,0,0,.4);
    transition: transform .1s;
  }
  #coinbox.pop { transform: scale(1.15); }
  #coinicon { width: 26px; height: 26px; }
  #coins { color: #ffd95e; font-weight: 800; font-size: 20px; min-width: 40px; text-align: right; font-variant-numeric: tabular-nums; }

  #shop {
    position: fixed; left: 0; right: 0; bottom: 0;
    display: flex; gap: 10px; justify-content: center;
    padding: 10px 12px calc(12px + env(safe-area-inset-bottom));
    z-index: 10;
  }
  .buy {
    flex: 1; max-width: 118px;
    border: none; border-radius: 16px; padding: 10px 4px 9px;
    background: linear-gradient(#8a5cf5, #6a3fd8);
    box-shadow: 0 5px 0 #4c2b9e, 0 8px 18px rgba(0,0,0,.45);
    color: #fff; font-weight: 800; font-size: 14px;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    cursor: pointer; user-select: none;
    transition: transform .08s, filter .15s;
  }
  .buy:active { transform: translateY(3px); box-shadow: 0 2px 0 #4c2b9e, 0 4px 10px rgba(0,0,0,.45); }
  .buy .big { font-size: 13px; letter-spacing: .2px; }
  .buy .lvl { font-size: 10px; opacity: .85; font-weight: 700; white-space: nowrap; }
  .buy .cost { font-size: 13px; color: #ffd95e; display: flex; align-items: center; gap: 4px; font-variant-numeric: tabular-nums; }
  .buy .cost svg { width: 14px; height: 14px; }
  .buy:disabled { filter: grayscale(.75) brightness(.75); cursor: default; }
  .buy:disabled:active { transform: none; box-shadow: 0 5px 0 #4c2b9e, 0 8px 18px rgba(0,0,0,.45); }

  #toast, .dialog {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: rgba(20, 12, 40, .92); border: 2px solid #f5b92b; border-radius: 20px;
    color: #fff; padding: 22px 30px; text-align: center; z-index: 20;
    box-shadow: 0 10px 40px rgba(0,0,0,.6); display: none; max-width: 86vw;
  }
  #toast h2, .dialog h2 { color: #ffd95e; margin-bottom: 8px; font-size: 22px; }
  #toast p, .dialog p { font-size: 16px; margin-bottom: 14px; }
  #toast button, .dialog button {
    border: none; border-radius: 12px; padding: 10px 26px;
    background: linear-gradient(#ffd95e, #f5a623); color: #4a2c00;
    font-weight: 800; font-size: 16px; cursor: pointer;
    box-shadow: 0 4px 0 #b97a10; margin: 0 5px;
  }
  .dialog button.danger {
    background: linear-gradient(#ff7070, #e03535); color: #fff;
    box-shadow: 0 4px 0 #9c1f1f;
  }
  .dialog button.ghost {
    background: #514266; color: #fff;
    box-shadow: 0 4px 0 #363044;
  }
  #resetBtn {
    pointer-events: auto; margin-left: 8px; flex: none;
    width: 40px; height: 40px; border-radius: 50%;
    border: 2px solid #8a76c9; background: rgba(20, 12, 40, .75); color: #cdbdf5;
    font-size: 20px; font-weight: 800; cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,.4);
  }
  #resetBtn:active { transform: scale(.92); }
  #hint {
    position: fixed; bottom: 92px; left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,.85); font-size: 14px; font-weight: 600;
    background: rgba(20,12,40,.6); padding: 6px 14px; border-radius: 999px;
    pointer-events: none; z-index: 9; transition: opacity 1s;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div id="title">💎 Gem Rush<span id="mineLabel"></span></div>
  <div id="coinbox">
    <svg id="coinicon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#f5b92b"/><circle cx="12" cy="12" r="8" fill="#ffd95e"/><text x="12" y="16.5" text-anchor="middle" font-size="12" font-weight="900" fill="#c07f00">$</text></svg>
    <span id="coins">0</span>
  </div>
  <button id="resetBtn" title="Reset game" aria-label="Reset game">⟳</button>
</div>

<div id="resetConfirm" class="dialog">
  <h2>Start over?</h2>
  <p>This wipes all coins, upgrades, and mine progress. There's no undo!</p>
  <button id="resetYes" class="danger">RESET</button>
  <button id="resetNo" class="ghost">KEEP PLAYING</button>
</div>

<div id="hint">Drag to drive your dozer! Tap a dozer to select it for upgrades.</div>

<div id="shop">
  <button class="buy" id="buyMiner">
    <span class="big">🚜 DOZER</span>
    <span class="lvl" id="minerLvl">x1</span>
    <span class="cost"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#f5b92b"/><circle cx="12" cy="12" r="8" fill="#ffd95e"/></svg><span id="minerCost">50</span></span>
  </button>
  <button class="buy" id="buySpeed">
    <span class="big">⚡ SPEED</span>
    <span class="lvl" id="speedLvl">Lv 1</span>
    <span class="cost"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#f5b92b"/><circle cx="12" cy="12" r="8" fill="#ffd95e"/></svg><span id="speedCost">30</span></span>
  </button>
  <button class="buy" id="buyCargo">
    <span class="big">📦 CARGO</span>
    <span class="lvl" id="cargoLvl">Lv 1</span>
    <span class="cost"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#f5b92b"/><circle cx="12" cy="12" r="8" fill="#ffd95e"/></svg><span id="cargoCost">35</span></span>
  </button>
  <button class="buy" id="buyValue">
    <span class="big">💰 VALUE</span>
    <span class="lvl" id="valueLvl">Lv 1</span>
    <span class="cost"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#f5b92b"/><circle cx="12" cy="12" r="8" fill="#ffd95e"/></svg><span id="valueCost">40</span></span>
  </button>
</div>

<div id="toast">
  <h2>Welcome back!</h2>
  <p id="toastMsg"></p>
  <button id="toastBtn">COLLECT</button>
</div>

<script>
'use strict';

// ============================== Setup ==============================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, viewScale = 1;

// The camera centers on the player's dozer and pans across a world much
// larger than the screen.
const cam = { x: 1000, y: 1000 };
let worldB = { minX: 0, minY: 0, maxX: 2000, maxY: 2000 };

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  viewScale = Math.min(1.3, Math.max(0.5, Math.max(W / 850, H / 1350)));
}
window.addEventListener('resize', resize);
resize();

function toWorld(px, py) {
  return { x: (px - W / 2) / viewScale + cam.x, y: (py - H / 2) / viewScale + cam.y };
}
function worldToScreen(wx, wy) {
  return { x: (wx - cam.x) * viewScale + W / 2, y: (wy - cam.y) * viewScale + H / 2 };
}
function updateCamera(dt, snap) {
  const p = miners[0];
  if (!p) return;
  const k = snap ? 1 : Math.min(1, dt * 5);
  cam.x += (p.x - cam.x) * k;
  cam.y += (p.y - cam.y) * k;
  const vw = W / viewScale / 2, vh = H / viewScale / 2;
  const ww = worldB.maxX - worldB.minX, wh = worldB.maxY - worldB.minY;
  cam.x = ww > vw * 2 ? Math.max(worldB.minX + vw, Math.min(worldB.maxX - vw, cam.x)) : worldB.minX + ww / 2;
  cam.y = wh > vh * 2 ? Math.max(worldB.minY + vh, Math.min(worldB.maxY - vh, cam.y)) : worldB.minY + wh / 2;
}

// ============================== Audio ==============================
let actx = null;
function sound(freq, dur, type = 'sine', vol = 0.15, slide = 0) {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), actx.currentTime + dur);
    g.gain.setValueAtTime(vol, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur);
  } catch (e) { /* audio unavailable */ }
}
const sfx = {
  pickup(n) { sound(500 + n * 60, 0.12, 'sine', 0.12); },
  sell()    { sound(700, 0.15, 'triangle', 0.18, 500); setTimeout(() => sound(950, 0.18, 'triangle', 0.15, 400), 70); },
  buy()     { sound(400, 0.12, 'square', 0.08, 200); setTimeout(() => sound(600, 0.15, 'square', 0.08, 250), 80); },
  unlock()  { [520, 660, 780, 1040].forEach((f, i) => setTimeout(() => sound(f, 0.25, 'triangle', 0.15), i * 90)); },
  chest()   { [660, 880, 1100].forEach((f, i) => setTimeout(() => sound(f, 0.2, 'sine', 0.15), i * 60)); },
  deny()    { sound(160, 0.2, 'sawtooth', 0.07, -60); },
};

// ============================== State ==============================
// dozers[0] is the player's; the rest are bots. Each has its own
// s (speed level) and c (cargo level).
const state = {
  coins: 0,
  valueLv: 1,
  level: 1,
  unlocked: [true, false, false, false],
  dozers: [{ s: 1, c: 1 }],
  lastSeen: Date.now(),
};
let selectedDozer = 0;

const MAX_DOZERS = 15, MAX_LVL = 25;

const SAVE_KEY = 'gemrush_save_v3';
function save() {
  state.lastSeen = Date.now();
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (e) {}
}
function migrateOld(o, isV1) {
  // v1/v2 saves had a global miner count + shared speed level
  state.coins = o.coins || 0;
  state.valueLv = Math.max(1, o.valueLv || 1);
  state.level = isV1 ? 1 : Math.min(Math.max(1, o.level || 1), LEVELS.length);
  const n = Math.min(MAX_DOZERS, Math.max(1, o.miners || 1));
  const s = Math.min(MAX_LVL, Math.max(1, o.speedLv || 1));
  state.dozers = Array.from({ length: n }, () => ({ s, c: Math.max(1, Math.round(s * 0.7)) }));
  if (isV1) {
    if (o.unlocked) state.unlocked = [true, !!o.unlocked.gold, !!o.unlocked.ruby, !!o.unlocked.rainbow];
  } else if (Array.isArray(o.unlocked) && o.unlocked.length === 4) {
    state.unlocked = o.unlocked.map(Boolean);
  }
  state.unlocked[0] = true;
  state.lastSeen = o.lastSeen || Date.now();
}
function load() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) {
      const v2 = localStorage.getItem('gemrush_save_v2');
      if (v2) { migrateOld(JSON.parse(v2), false); return; }
      const v1 = localStorage.getItem('gemrush_save_v1');
      if (v1) { migrateOld(JSON.parse(v1), true); return; }
      return;
    }
    const s = JSON.parse(raw);
    state.coins = s.coins || 0;
    state.valueLv = Math.max(1, s.valueLv || 1);
    state.level = Math.min(Math.max(1, s.level || 1), LEVELS.length);
    if (Array.isArray(s.unlocked) && s.unlocked.length === 4) state.unlocked = s.unlocked.map(Boolean);
    state.unlocked[0] = true;
    if (Array.isArray(s.dozers) && s.dozers.length) {
      state.dozers = s.dozers.slice(0, MAX_DOZERS).map(d => ({
        s: Math.min(MAX_LVL, Math.max(1, d.s || 1)),
        c: Math.min(MAX_LVL, Math.max(1, d.c || 1)),
      }));
    }
    state.lastSeen = s.lastSeen || Date.now();
  } catch (e) {}
}

const dozerCost = () => Math.floor(50 * Math.pow(1.65, state.dozers.length - 1));
const speedCost = d => Math.floor(30 * Math.pow(1.6, d.s - 1));
const cargoCost = d => Math.floor(35 * Math.pow(1.6, d.c - 1));
const valueCost = () => Math.floor(40 * Math.pow(1.6, state.valueLv - 1));
const dozerSpeedMult = d => 1 + (d.s - 1) * 0.22;
const dozerCargo = d => 2 + d.c * 2;          // bot haul multiplier
const playerCap = d => 5 + d.c * 3;           // player cargo slots
const valueMult = () => 1 + (state.valueLv - 1) * 0.5;

function fmt(n) {
  if (n >= 1e15) return (n / 1e15).toFixed(1) + 'Q';
  if (n >= 1e12) return (n / 1e12).toFixed(1) + 'T';
  if (n >= 1e9) return (n / 1e9).toFixed(1) + 'B';
  if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
  if (n >= 1e4) return (n / 1e3).toFixed(1) + 'K';
  return Math.floor(n).toString();
}

// ============================== Levels ==============================
// 10 themed mines. Each has 4 ore patches at the same pit positions; values and
// unlock costs scale by MINE_SCALE per level so pacing stays consistent while
// numbers grow. Clearing all 4 opens the NEXT MINE portal in the pit center.
const BASE_VALUES = [1, 6, 25, 90];
const BASE_COSTS  = [0, 150, 1200, 9000];
const NEXT_MINE_BASE = 30000;
const MINE_SCALE = 25;

// Mine layouts — chambers (floor ellipses) joined by roads. `nodes`+`edges`
// double as both the drawn roads and the waypoint graph miners navigate.
// Layouts cycle across the 10 mines, so each mine feels different.
const LAYOUTS = [
  { // Grand Pit — central hub with four ore outposts down long roads
    chambers: [{ x: 1000, y: 1000, rx: 280, ry: 240 }, { x: 1000, y: 420, rx: 230, ry: 190 }, { x: 1620, y: 1020, rx: 230, ry: 190 }, { x: 1000, y: 1600, rx: 230, ry: 190 }, { x: 380, y: 1020, rx: 230, ry: 190 }],
    nodes: [{ x: 1000, y: 1000 }, { x: 1000, y: 420 }, { x: 1620, y: 1020 }, { x: 1000, y: 1600 }, { x: 380, y: 1020 }],
    edges: [[0, 1], [0, 2], [0, 3], [0, 4]],
    ores: [{ x: 1000, y: 380, r: 80 }, { x: 1650, y: 1000, r: 80 }, { x: 350, y: 1000, r: 78 }, { x: 1000, y: 1630, r: 78 }],
    sell: { x: 1000, y: 1080 }, gate: { x: 1000, y: 880 } },
  { // Twin Hollows — two big pits joined by one long diagonal road
    chambers: [{ x: 450, y: 500, rx: 320, ry: 280 }, { x: 1550, y: 1500, rx: 340, ry: 300 }],
    nodes: [{ x: 450, y: 500 }, { x: 1000, y: 1000 }, { x: 1550, y: 1500 }],
    edges: [[0, 1], [1, 2]],
    ores: [{ x: 280, y: 380, r: 78 }, { x: 640, y: 330, r: 78 }, { x: 1330, y: 1630, r: 74 }, { x: 1760, y: 1400, r: 74 }],
    sell: { x: 1580, y: 1520 }, gate: { x: 440, y: 660 } },
  { // Crossroads — three distant chambers meeting at a central junction
    chambers: [{ x: 420, y: 420, rx: 280, ry: 220 }, { x: 1580, y: 420, rx: 280, ry: 220 }, { x: 1000, y: 1650, rx: 300, ry: 230 }],
    nodes: [{ x: 420, y: 420 }, { x: 1580, y: 420 }, { x: 1000, y: 1650 }, { x: 1000, y: 900 }],
    edges: [[0, 3], [1, 3], [2, 3]],
    ores: [{ x: 260, y: 400, r: 72 }, { x: 580, y: 320, r: 72 }, { x: 1620, y: 380, r: 76 }, { x: 860, y: 1700, r: 72 }],
    sell: { x: 1160, y: 1620 }, gate: { x: 1000, y: 900 } },
  { // Serpent Canyon — four far-flung caves along a winding road
    chambers: [{ x: 350, y: 350, rx: 240, ry: 190 }, { x: 1650, y: 650, rx: 240, ry: 190 }, { x: 350, y: 1250, rx: 240, ry: 190 }, { x: 1650, y: 1750, rx: 260, ry: 200 }],
    nodes: [{ x: 350, y: 350 }, { x: 1650, y: 650 }, { x: 350, y: 1250 }, { x: 1650, y: 1750 }],
    edges: [[0, 1], [1, 2], [2, 3]],
    ores: [{ x: 300, y: 300, r: 74 }, { x: 1700, y: 600, r: 74 }, { x: 280, y: 1290, r: 72 }, { x: 1480, y: 1800, r: 70 }],
    sell: { x: 1750, y: 1680 }, gate: { x: 460, y: 1160 } },
  { // The Loop — a huge ring of caves around a rocky island
    chambers: [{ x: 1000, y: 350, rx: 270, ry: 185 }, { x: 1700, y: 1050, rx: 210, ry: 250 }, { x: 1000, y: 1750, rx: 270, ry: 185 }, { x: 300, y: 1050, rx: 210, ry: 250 }],
    nodes: [{ x: 1000, y: 350 }, { x: 1700, y: 1050 }, { x: 1000, y: 1750 }, { x: 300, y: 1050 }],
    edges: [[0, 1], [1, 2], [2, 3], [3, 0]],
    ores: [{ x: 880, y: 320, r: 74 }, { x: 1730, y: 1000, r: 70 }, { x: 270, y: 990, r: 70 }, { x: 840, y: 1780, r: 66 }],
    sell: { x: 1160, y: 1740 }, gate: { x: 1160, y: 380 } },
];

const LEVELS = [
  { name: 'Amethyst Hollow', bg: ['#3b2d63', '#241b3f'], floor: ['#a9a3b8', '#b7b1c6'],
    rockLight: ['#8474bd', '#7563ad', '#9382cc'], rockDark: ['#5e4f91', '#524384', '#6b5aa5'],
    ores: [
      { name: 'Crystal', color: '#eef4ff', spark: '#ffffff', mound: '#dfe8fa', moundDark: '#b9c6e6' },
      { name: 'Gold',    color: '#ffc23e', spark: '#ffe9a8', mound: '#f5a623', moundDark: '#c77f12' },
      { name: 'Ruby',    color: '#ff5a6e', spark: '#ffb3bd', mound: '#e6394f', moundDark: '#a81f31' },
      { name: 'Prism',   color: '#c084fc', spark: '#f0dbff', mound: '#a855f7', moundDark: '#7e22ce' },
    ] },
  { name: 'Frost Cavern', bg: ['#1e3a5f', '#12233d'], floor: ['#9fb8cc', '#b4cddd'],
    rockLight: ['#6f9ec4', '#5f8db3', '#82addb'], rockDark: ['#48719a', '#3d648c', '#5480ab'],
    ores: [
      { name: 'Ice',      color: '#d8f4ff', spark: '#ffffff', mound: '#c2ecfc', moundDark: '#8fc6e0' },
      { name: 'Sapphire', color: '#3f7bff', spark: '#a8c6ff', mound: '#2f63e0', moundDark: '#1d43a5' },
      { name: 'Cobalt',   color: '#4fd8e8', spark: '#c0f4fa', mound: '#2ab8c9', moundDark: '#177f8d' },
      { name: 'Aurora',   color: '#9ef0c0', spark: '#e0fff0', mound: '#5cd898', moundDark: '#2f9c66' },
    ] },
  { name: 'Lava Fields', bg: ['#4a1d15', '#2a0f0a'], floor: ['#8a6a5e', '#9c7a6a'],
    rockLight: ['#a35540', '#8f4736', '#b56650'], rockDark: ['#6f3527', '#5f2c20', '#804030'],
    ores: [
      { name: 'Ember',      color: '#ffb35c', spark: '#ffe0b8', mound: '#f5923a', moundDark: '#b8641c' },
      { name: 'Topaz',      color: '#ffd23e', spark: '#fff0b0', mound: '#e8b420', moundDark: '#a87f0e' },
      { name: 'Garnet',     color: '#ff4040', spark: '#ffb0a8', mound: '#d82a2a', moundDark: '#961616' },
      { name: 'Magma Core', color: '#ff7a2a', spark: '#ffd0a0', mound: '#e85510', moundDark: '#a03608' },
    ] },
  { name: 'Jungle Mine', bg: ['#1d4028', '#0f2616'], floor: ['#8fa88a', '#a2bb98'],
    rockLight: ['#5f9c58', '#4f8a4a', '#72af68'], rockDark: ['#3d6e3a', '#325f30', '#4a8045'],
    ores: [
      { name: 'Jade',       color: '#7ee8a8', spark: '#d8ffe8', mound: '#4ecc84', moundDark: '#2a8f58' },
      { name: 'Emerald',    color: '#2ee06a', spark: '#b0ffc8', mound: '#1cba52', moundDark: '#0e8038' },
      { name: 'Moss Opal',  color: '#b8e858', spark: '#ecffc0', mound: '#94c832', moundDark: '#648c1c' },
      { name: 'Wild Prism', color: '#58e8e0', spark: '#c8fffa', mound: '#2ac4bc', moundDark: '#168880' },
    ] },
  { name: 'Desert Quarry', bg: ['#5c4322', '#372812'], floor: ['#c4ad85', '#d4bf96'],
    rockLight: ['#c49a5c', '#b0884c', '#d4ac70'], rockDark: ['#8f6e3c', '#7d5f32', '#a07c48'],
    ores: [
      { name: 'Amber',    color: '#ffb340', spark: '#ffe4b0', mound: '#e89420', moundDark: '#a8680e' },
      { name: 'Sunstone', color: '#ff8c4a', spark: '#ffd4b8', mound: '#e86a24', moundDark: '#a84812' },
      { name: 'Citrine',  color: '#ffe45c', spark: '#fff6c8', mound: '#e8c433', moundDark: '#a8891c' },
      { name: 'Mirage',   color: '#6ad4ff', spark: '#d0f2ff', mound: '#38b4e8', moundDark: '#1c7ca8' },

    maxX: Math.max(b.maxX, ch.x + ch.rx + 170),
    maxY: Math.max(b.maxY, ch.y + ch.ry + 170),

// Waypoint navigation along the layout's road graph
function nearestNode(x, y) {
  let bi = 0, bd = Infinity;
  layout.nodes.forEach((n, i) => {
    const d = Math.hypot(n.x - x, n.y - y);
    if (d < bd) { bd = d; bi = i; }
  });
  return bi;
}
function findRoute(fx, fy, tx, ty) {
  const nf = nearestNode(fx, fy), nt = nearestNode(tx, ty);
  if (nf === nt) return [{ x: tx, y: ty }];
  const prev = new Array(layout.nodes.length).fill(-1);
  prev[nf] = nf;
  const q = [nf];
  while (q.length) {
    const u = q.shift();
    if (u === nt) break;
    for (const [a, b] of layout.edges) {
      const v = a === u ? b : b === u ? a : -1;
      if (v >= 0 && prev[v] === -1) { prev[v] = u; q.push(v); }
    }
  }
  if (prev[nt] === -1) return [{ x: tx, y: ty }];
  const pts = [];
  let cur = nt;
  while (cur !== nf) { pts.push(layout.nodes[cur]); cur = prev[cur]; }
  pts.reverse();
  // jitter waypoints so miners spread across the road instead of single-filing
  const route = pts.map(p => ({ x: p.x + (Math.random() - 0.5) * 48, y: p.y + (Math.random() - 0.5) * 48 }));
  route.push({ x: tx, y: ty });
  return route;
}
function followRoute(m, spd, dt) {
  if (!m.route || !m.route.length) return true;
  const p = m.route[0];
  if (moveToward(m, p.x, p.y, spd, dt)) m.route.shift();
  return m.route.length === 0;
}

let sellPad = { x: 400, y: 900, w: 190, h: 84 };

// Decorative rocks walling in the chambers, with gaps where roads pass
const rocks = [];
function distToSeg(px, py, a, b) {
  const dx = b.x - a.x, dy = b.y - a.y;
  const L2 = dx * dx + dy * dy || 1;
  let t = ((px - a.x) * dx + (py - a.y) * dy) / L2;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (a.x + dx * t), py - (a.y + dy * t));
}
function buildRocks() {
  rocks.length = 0;
  const segs = layout.edges.map(([a, b]) => [layout.nodes[a], layout.nodes[b]]);
  layout.chambers.forEach((ch, ci) => {
    const per = Math.max(14, Math.round((ch.rx + ch.ry) / 26));
    for (let i = 0; i < per; i++) {
      const a = (i / per) * Math.PI * 2 + (i % 3) * 0.05 + ci * 0.4;
      const wob = 0.98 + ((i * 37 + ci * 11) % 10) / 60;
      const x = ch.x + Math.cos(a) * (ch.rx + 26) * wob;
      const y = ch.y + Math.sin(a) * (ch.ry + 26) * wob;
      if (segs.some(([p, q]) => distToSeg(x, y, p, q) < 88)) continue;
      if (layout.chambers.some(c => c !== ch &&
          ((x - c.x) / c.rx) ** 2 + ((y - c.y) / c.ry) ** 2 < 1)) continue;
      rocks.push({ x, y, r: 40 + ((i * 53 + ci * 17) % 26), shade: (i * 29) % 3 });
    }
  });
  // rocks lining both sides of the long roads, canyon-style
  segs.forEach(([p, q], si) => {
    const len = Math.hypot(q.x - p.x, q.y - p.y);
    const nx = -(q.y - p.y) / len, ny = (q.x - p.x) / len;
    const steps = Math.floor(len / 130);
    for (let s = 1; s < steps; s++) {
      const t = s / steps;
      const px = p.x + (q.x - p.x) * t, py = p.y + (q.y - p.y) * t;
      for (const side of [-1, 1]) {
        const off = 108 + ((s * 29 + si * 13 + (side + 1) * 7) % 26);
        const x = px + nx * side * off, y = py + ny * side * off;
        if (layout.chambers.some(c =>
            ((x - c.x) / (c.rx + 30)) ** 2 + ((y - c.y) / (c.ry + 30)) ** 2 < 1)) continue;
        if (segs.some((seg2, sj) => sj !== si && distToSeg(x, y, seg2[0], seg2[1]) < 88)) continue;
        rocks.push({ x, y, r: 34 + ((s * 17 + si * 7) % 20), shade: (s * 31 + si) % 3 });
      }
    }
  });
}

// Miners (little bulldozers)
const miners = [];
function addMinerEntity(i) {
  miners.push({
    idx: i, isPlayer: i === 0,
    x: sellPad.x + (Math.random() - 0.5) * 120,
    y: sellPad.y - 60 + (Math.random() - 0.5) * 40,
    angle: -Math.PI / 2,
    state: 'toOre', t: 0, target: null, route: null,
    load: 0, hue: i === 0 ? 45 : (i * 47) % 360, bob: Math.random() * 6,
    units: 0, loadVal: 0, digT: 0, loadColor: '#ffd95e', wasFull: false,
  });
}

// Where the player's dozer is allowed to drive: chamber floors and roads.
function isOnFloor(x, y) {
  for (const ch of layout.chambers) {
    const ex = (x - ch.x) / Math.max(1, ch.rx - 16);
    const ey = (y - ch.y) / Math.max(1, ch.ry - 16);
    if (ex * ex + ey * ey <= 1) return true;
  }
  for (const [a, b] of layout.edges) {
    if (distToSeg(x, y, layout.nodes[a], layout.nodes[b]) < 52) return true;
  }
  return false;
}

// FX
const particles = [];  // {x,y,vx,vy,life,color,size,grav}

function burst(x, y, color, n = 10, spread = 3.4) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = 1 + Math.random() * spread;
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 2, life: 0.7 + Math.random() * 0.4, color, size: 3 + Math.random() * 4, grav: 9 });
  }
}
function floatText(x, y, text, color = '#ffd95e', size = 26) {
  floaters.push({ x, y, text, life: 1.1, color, size });
}
function coinFly(x, y, n) {
  for (let i = 0; i < Math.min(n, 8); i++) {
    flyCoins.push({ x: x + (Math.random() - 0.5) * 40, y: y + (Math.random() - 0.5) * 20, t: 0, delay: i * 0.06 });
  }
}

// ============================== Game logic ==============================
function unlockedPatches() { return patches.filter(p => state.unlocked[p.idx]); }

function addCoins(n) {
  state.coins += n;
  const box = document.getElementById('coinbox');
  box.classList.remove('pop'); void box.offsetWidth; box.classList.add('pop');
}

function updatePatches(dt) {
  for (const p of patches) {
    if (!state.unlocked[p.idx]) continue;
    p.spawnT -= dt;
    if (p.spawnT <= 0 && p.gems.length < 26) {
      p.spawnT = 0.5 + Math.random() * 0.7;
      const a = Math.random() * Math.PI * 2, d = p.r * (0.35 + Math.random() * 0.85);
      p.gems.push({ x: p.x + Math.cos(a) * d, y: p.y + Math.sin(a) * d * 0.75 + 18, phase: Math.random() * 6.28 });
    }
  }
}

function updateMiners(dt) {
  while (miners.length < state.dozers.length) addMinerEntity(miners.length);

  miners.forEach((m, i) => {
    const d = state.dozers[i];
    if (!d) return;
    if (m.isPlayer) { updatePlayer(m, d, dt); return; }

    const spd = 260 * dozerSpeedMult(d);
    m.bob += dt * 10;
    if (m.state === 'toOre') {
      if (!m.target || !patches.includes(m.target) || !state.unlocked[m.target.idx]) {
        const ups = unlockedPatches();
        m.target = ups[Math.floor(Math.random() * ups.length)];
        m.dest = { x: m.target.x + (Math.random() - 0.5) * m.target.r, y: m.target.y + 30 + Math.random() * 30 };
        m.route = findRoute(m.x, m.y, m.dest.x, m.dest.y);
      }
      if (followRoute(m, spd, dt)) { m.state = 'mine'; m.t = 1.4 / dozerSpeedMult(d); }
    } else if (m.state === 'mine') {
      m.t -= dt;
      if (Math.random() < dt * 14) {
        particles.push({ x: m.x + (Math.random() - 0.5) * 30, y: m.y + (Math.random() - 0.5) * 16, vx: (Math.random() - 0.5) * 2, vy: -1 - Math.random() * 2, life: 0.5, color: m.target.spark, size: 2 + Math.random() * 3, grav: 4 });
      }
      if (m.t <= 0) {
        m.load = Math.round(m.target.value * dozerCargo(d) * valueMult());
        m.loadColor = m.target.color;
        // eat a couple of the visible loose gems so the pile churns
        m.target.gems.splice(0, 2);
        m.state = 'toSell';
        m.route = null;
      }
    } else if (m.state === 'toSell') {
      if (!m.route) m.route = findRoute(m.x, m.y, sellPad.x + (Math.random() - 0.5) * 30, sellPad.y - 10);
      if (followRoute(m, spd, dt)) { m.state = 'sell'; m.t = 0.35; }
    } else if (m.state === 'sell') {
      m.t -= dt;
      if (m.t <= 0) {
        addCoins(m.load);
        floatText(m.x, m.y - 50, '+' + fmt(m.load));
        coinFly(m.x, m.y - 30, Math.ceil(m.load / 10));
        burst(m.x, m.y - 10, '#ffd95e', 8, 2.5);
        sfx.sell();
        m.load = 0; m.state = 'toOre'; m.target = null; m.route = null;
      }
    }
  });
}

let lastPickupSfx = 0;
function updatePlayer(m, d, dt) {
  const spd = 330 * dozerSpeedMult(d);
  const cap = playerCap(d);

  // steering: joystick drag or keyboard
  let vx = 0, vy = 0;
  if (joy && joy.moved) {
    const len = Math.hypot(joy.dx, joy.dy) || 1;
    const mag = Math.min(1, len / 70);
    vx = joy.dx / len * mag; vy = joy.dy / len * mag;
  }
  const kx = (keys.ArrowRight || keys.d ? 1 : 0) - (keys.ArrowLeft || keys.a ? 1 : 0);
  const ky = (keys.ArrowDown || keys.s ? 1 : 0) - (keys.ArrowUp || keys.w ? 1 : 0);
  if (kx || ky) { const kl = Math.hypot(kx, ky); vx = kx / kl; vy = ky / kl; }

  if (vx || vy) {
    const nx = m.x + vx * spd * dt, ny = m.y + vy * spd * dt;
    if (isOnFloor(nx, m.y)) m.x = nx;
    if (isOnFloor(m.x, ny)) m.y = ny;
    const want = Math.atan2(vy, vx);
    let da = want - m.angle;
    while (da > Math.PI) da -= Math.PI * 2;
    while (da < -Math.PI) da += Math.PI * 2;
    m.angle += da * Math.min(1, dt * 10);
    m.bob += dt * 14;
  }

  const now = performance.now() / 1000;

  // scoop loose gems by driving over them
  for (const p of patches) {
    if (!state.unlocked[p.idx]) continue;
    for (let gi = p.gems.length - 1; gi >= 0; gi--) {
      if (m.units >= cap) break;
      const g = p.gems[gi];
      if (Math.hypot(m.x - g.x, m.y - g.y) < 46) {
        m.units++; m.loadVal += p.value * valueMult(); m.loadColor = p.color;
        particles.push({ x: g.x, y: g.y, vx: (Math.random() - 0.5) * 2, vy: -3, life: 0.4, color: p.spark, size: 4, grav: 8 });
        p.gems.splice(gi, 1);
        if (now - lastPickupSfx > 0.09) { lastPickupSfx = now; sfx.pickup(Math.min(m.units, 8)); }
      }
    }
  }

  // dig while parked on an ore mound
  if (m.units < cap) {
    const p = patches.find(p => state.unlocked[p.idx] && Math.hypot(m.x - p.x, m.y - p.y) < p.r + 8);
    if (p) {
      m.digT -= dt;
      if (m.digT <= 0) {
        m.digT = 0.4 / dozerSpeedMult(d);
        m.units++; m.loadVal += p.value * valueMult(); m.loadColor = p.color;
        for (let k = 0; k < 3; k++) {
          particles.push({ x: m.x + (Math.random() - 0.5) * 34, y: m.y + (Math.random() - 0.5) * 20, vx: (Math.random() - 0.5) * 2.5, vy: -1.5 - Math.random() * 2, life: 0.5, color: p.spark, size: 2 + Math.random() * 3, grav: 5 });
        }
        if (now - lastPickupSfx > 0.15) { lastPickupSfx = now; sfx.pickup(3); }
      }
    }
  }

  // full-cargo nudge
  if (m.units >= cap && !m.wasFull) { m.wasFull = true; floatText(m.x, m.y - 60, 'FULL! Drive to SELL', '#ffd95e', 22); }
  if (m.units < cap) m.wasFull = false;

  // sell by driving onto the pad
  if (m.units > 0 &&
      Math.abs(m.x - sellPad.x) < sellPad.w / 2 + 26 &&
      Math.abs(m.y - sellPad.y) < sellPad.h / 2 + 26) {
    const total = Math.max(1, Math.round(m.loadVal));
    addCoins(total);
    floatText(m.x, m.y - 50, '+' + fmt(total));
    coinFly(m.x, m.y - 30, Math.ceil(Math.min(8, m.units)));
    burst(m.x, m.y - 10, '#ffd95e', 10, 3);
    sfx.sell();
    m.units = 0; m.loadVal = 0;
    save();
  }

  // drive-into interactions: chest, locked gates, next-mine portal
  if (chest && Math.hypot(m.x - chest.x, m.y - chest.y) < 60) openChest();
  for (const p of patches) {
    if (state.unlocked[p.idx]) continue;
    if (Math.hypot(m.x - p.x, m.y - (p.y + 40)) < 95) tryUnlockPatch(p, false);
  }
  if (allUnlocked() && state.level < LEVELS.length &&
      Math.hypot(m.x - layout.gate.x, m.y - layout.gate.y) < 80) {
    tryPortal(false);
  }
}

function moveToward(m, tx, ty, spd, dt) {
  const dx = tx - m.x, dy = ty - m.y;
  const d = Math.hypot(dx, dy);
  if (d < 6) return true;
  const step = Math.min(d, spd * dt);
  m.x += (dx / d) * step; m.y += (dy / d) * step;
  const want = Math.atan2(dy, dx);
  let da = want - m.angle;
  while (da > Math.PI) da -= Math.PI * 2;
  while (da < -Math.PI) da += Math.PI * 2;
  m.angle += da * Math.min(1, dt * 8);
  return false;
}

function updateChest(dt) {
  if (chest) {
    chest.t += dt; chest.life -= dt;
    if (chest.life <= 0) chest = null;
  } else {
    chestTimer -= dt;
    if (chestTimer <= 0) {
      chestTimer = 35 + Math.random() * 30;
      const ch = layout.chambers[Math.floor(Math.random() * layout.chambers.length)];
      chest = { x: ch.x + (Math.random() - 0.5) * ch.rx * 0.9,
                y: ch.y + (Math.random() - 0.5) * ch.ry * 0.9, t: 0, life: 22 };
    }
  }
}

function updateFX(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt; p.x += p.vx * 60 * dt * 0.06 * 16; p.y += p.vy * 60 * dt * 0.06 * 16;
    p.vy += p.grav * dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (let i = floaters.length - 1; i >= 0; i--) {
    const f = floaters[i];
    f.life -= dt; f.y -= 45 * dt;
    if (f.life <= 0) floaters.splice(i, 1);
  }
  for (let i = flyCoins.length - 1; i >= 0; i--) {
    const c = flyCoins[i];
    if (c.delay > 0) { c.delay -= dt; continue; }
    c.t += dt * 1.8;
    if (c.t >= 1) flyCoins.splice(i, 1);
  }
  if (shake > 0) shake = Math.max(0, shake - dt * 30);
  if (denyMsgT > 0) denyMsgT -= dt;
  if (tapComboT > 0) { tapComboT -= dt; if (tapComboT <= 0) tapCombo = 0; }
}

// ============================== Input ==============================
let denyMsgT = 0; // throttles "need more coins" messages from drive-into attempts

function openChest() {
  const ups = unlockedPatches();
  const avgVal = ups.reduce((s, p) => s + p.value, 0) / ups.length;
  const reward = Math.max(25, Math.round(avgVal * (15 + state.dozers.length * 8) * valueMult() * 2));
  addCoins(reward);
  floatText(chest.x, chest.y - 60, '+' + fmt(reward), '#ffd95e', 34);
  burst(chest.x, chest.y, '#ffd95e', 26, 5);
  burst(chest.x, chest.y, '#fff3c4', 14, 4);
  coinFly(chest.x, chest.y, 8);
  sfx.chest();
  shake = 6;
  chest = null;
}

function tryUnlockPatch(p, force) {
  if (state.coins >= p.cost) {
    state.coins -= p.cost;
    state.unlocked[p.idx] = true;
    burst(p.x, p.y, p.color, 30, 5);
    burst(p.x, p.y, '#ffffff', 16, 4);
    floatText(p.x, p.y - 40, p.name + ' unlocked!', '#ffffff', 30);
    sfx.unlock();
    shake = 8;
    save();
  } else if (force || denyMsgT <= 0) {
    denyMsgT = 1.5;
    floatText(p.x, p.y - 40, 'Need ' + fmt(p.cost - state.coins) + ' more!', '#ff8080', 24);
    sfx.deny();
  }
}

function tryPortal(force) {
  const g = layout.gate;
  const c = nextMineCost();
  if (state.coins >= c) {
    state.coins -= c;
    state.level++;
    state.unlocked = [true, false, false, false];
    loadLevel();
    const g2 = layout.gate;
    burst(g2.x, g2.y, '#ffd95e', 40, 6);
    burst(g2.x, g2.y, '#ffffff', 20, 5);
    floatText(g2.x, g2.y - 60, 'Mine ' + state.level + ': ' + currentLevel().name + '!', '#ffffff', 32);
    sfx.unlock();
    shake = 12;
    save();
  } else if (force || denyMsgT <= 0) {
    denyMsgT = 1.5;
    floatText(g.x, g.y - 60, 'Need ' + fmt(c - state.coins) + ' more!', '#ff8080', 24);
    sfx.deny();
  }
}

function onTap(px, py) {
  const w = toWorld(px, py);

  // Chest?
  if (chest && Math.hypot(w.x - chest.x, w.y - chest.y) < 70) { openChest(); return; }

  // Select a dozer?
  for (let i = miners.length - 1; i >= 0; i--) {
    if (Math.hypot(w.x - miners[i].x, w.y - miners[i].y) < 48) {
      selectedDozer = i;
      sfx.pickup(2);
      refreshShop();
      return;
    }
  }

  // Next-mine portal?
  if (allUnlocked() && state.level < LEVELS.length &&
      Math.hypot(w.x - layout.gate.x, w.y - layout.gate.y) < 95) {
    tryPortal(true);
    return;
  }

  // Gate?
  for (const p of patches) {
    if (state.unlocked[p.idx]) continue;
    if (Math.hypot(w.x - p.x, w.y - (p.y + 40)) < 100) {
      tryUnlockPatch(p, true);
      return;
    }
  }

  // Loose gems — generous radius, collect the whole cluster under your thumb.
  let got = 0, gotValue = 0, gx = 0, gy = 0, col = '#fff';
  for (const p of patches) {
    if (!state.unlocked[p.idx]) continue;
    for (let i = p.gems.length - 1; i >= 0; i--) {
      const g = p.gems[i];
      if (Math.hypot(w.x - g.x, w.y - g.y) < 64) {
        got++; gotValue += p.value * valueMult();
        gx += g.x; gy += g.y; col = p.color;
        particles.push({ x: g.x, y: g.y, vx: (Math.random() - 0.5) * 3, vy: -3, life: 0.5, color: p.spark, size: 4, grav: 8 });
        p.gems.splice(i, 1);
      }
    }
  }
  if (got > 0) {
    tapCombo++; tapComboT = 1.2;
    const bonus = 1 + Math.min(tapCombo, 10) * 0.1;
    const total = Math.max(1, Math.round(gotValue * bonus));
    addCoins(total);
    gx /= got; gy /= got;
    floatText(gx, gy - 30, '+' + fmt(total) + (tapCombo >= 3 ? '  x' + tapCombo : ''), '#ffd95e', 24 + Math.min(tapCombo, 8));
    burst(gx, gy, col, 6 + got, 3);
    sfx.pickup(Math.min(tapCombo, 8));
    save();
  }
}

// Pointer input: a quick tap fires onTap; press-and-drag becomes a floating
// joystick that steers the player's dozer.
let joy = null;
const keys = {};
canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (joy) return;
  joy = { id: e.pointerId, sx: e.clientX, sy: e.clientY, dx: 0, dy: 0, moved: false, t0: performance.now() };
});
canvas.addEventListener('pointermove', e => {
  if (!joy || e.pointerId !== joy.id) return;
  joy.dx = e.clientX - joy.sx;
  joy.dy = e.clientY - joy.sy;
  if (Math.hypot(joy.dx, joy.dy) > 14) joy.moved = true;
});
function endJoy(e) {
  if (!joy || e.pointerId !== joy.id) return;
  if (!joy.moved && performance.now() - joy.t0 < 400) onTap(e.clientX, e.clientY);
  joy = null;
}
canvas.addEventListener('pointerup', endJoy);
canvas.addEventListener('pointercancel', endJoy);
window.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.key] = false; });

// ============================== Shop ==============================
const $ = id => document.getElementById(id);
const selDozer = () => state.dozers[Math.min(selectedDozer, state.dozers.length - 1)];
const selName = () => selectedDozer === 0 ? 'YOU' : 'BOT ' + selectedDozer;
function bindBuy(btnId, getCost, apply, isMaxed) {
  $(btnId).addEventListener('click', () => {
    if (isMaxed && isMaxed()) { sfx.deny(); return; }
    const c = getCost();
    if (state.coins < c) { sfx.deny(); return; }
    state.coins -= c;
    apply();
    sfx.buy();
    save();
    refreshShop();
  });
}
bindBuy('buyMiner', dozerCost,
  () => { state.dozers.push({ s: 1, c: 1 }); floatText(400, 760, '+1 Dozer!', '#a8ff9e', 30); },
  () => state.dozers.length >= MAX_DOZERS);
bindBuy('buySpeed', () => speedCost(selDozer()),
  () => { selDozer().s++; floatText(400, 760, selName() + ': faster!', '#9edbff', 30); },
  () => selDozer().s >= MAX_LVL);
bindBuy('buyCargo', () => cargoCost(selDozer()),
  () => { selDozer().c++; floatText(400, 760, selName() + ': bigger cargo!', '#ffb974', 30); },
  () => selDozer().c >= MAX_LVL);
bindBuy('buyValue', valueCost, () => { state.valueLv++; floatText(400, 760, 'Gems worth more!', '#ffd95e', 30); });

// ============================== Reset ==============================
$('resetBtn').addEventListener('click', () => { $('resetConfirm').style.display = 'block'; });
$('resetNo').addEventListener('click', () => { $('resetConfirm').style.display = 'none'; });
$('resetYes').addEventListener('click', () => {
  try {
    localStorage.removeItem('gemrush_save_v3');
    localStorage.removeItem('gemrush_save_v2');
    localStorage.removeItem('gemrush_save_v1');
  } catch (e) {}
  state.coins = 0;
  state.dozers = [{ s: 1, c: 1 }];
  state.valueLv = 1;
  state.level = 1;
  state.unlocked = [true, false, false, false];
  selectedDozer = 0;
  miners.length = 0;
  particles.length = 0; floaters.length = 0; flyCoins.length = 0;
  chest = null; chestTimer = 20;
  tapCombo = 0; tapComboT = 0;
  loadLevel();
  save();
  refreshShop();

  floatText(400, 600, 'Fresh start!', '#a8ff9e', 34);

function refreshShop() {
  if (selectedDozer >= state.dozers.length) selectedDozer = 0;
  const d = selDozer(), who = selName();
  const dMax = state.dozers.length >= MAX_DOZERS;
  const sMax = d.s >= MAX_LVL, cMax = d.c >= MAX_LVL;
  $('minerLvl').textContent = 'x' + state.dozers.length;
  $('speedLvl').textContent = who + ' · Lv ' + d.s;
  $('cargoLvl').textContent = who + ' · Lv ' + d.c;
  $('valueLvl').textContent = 'Lv ' + state.valueLv;
  $('minerCost').textContent = dMax ? 'MAX' : fmt(dozerCost());
  $('speedCost').textContent = sMax ? 'MAX' : fmt(speedCost(d));
  $('cargoCost').textContent = cMax ? 'MAX' : fmt(cargoCost(d));
  $('valueCost').textContent = fmt(valueCost());
  $('buyMiner').disabled = dMax || state.coins < dozerCost();
  $('buySpeed').disabled = sMax || state.coins < speedCost(d);
  $('buyCargo').disabled = cMax || state.coins < cargoCost(d);
  $('buyValue').disabled = state.coins < valueCost();
}

// ============================== Rendering ==============================
function draw(t) {
  ctx.clearRect(0, 0, W, H);

  // Background (themed per mine)
  const theme = currentLevel();
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, theme.bg[0]); bg.addColorStop(1, theme.bg[1]);
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

  ctx.save();
  let sx = 0, sy = 0;
  if (shake > 0) { sx = (Math.random() - 0.5) * shake; sy = (Math.random() - 0.5) * shake; }
  ctx.translate(W / 2 + sx, H / 2 + sy);
  ctx.scale(viewScale, viewScale);
  ctx.translate(-cam.x, -cam.y);

  drawPit();
  drawSellPad(t);
  drawNextGate(t);
  for (const p of patches) drawPatch(p, t);
  if (chest) drawChest(t);
  drawMiners(t);
  drawParticles();
  drawFloaters();

  ctx.restore();
  drawFlyCoins();
  drawJoystick();
  drawMinimap(t);
}

function drawPit() {
  const theme = currentLevel();
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const roadSegs = layout.edges.map(([a, b]) => [layout.nodes[a], layout.nodes[b]]);

  // dark floor base: chambers + connecting roads
  ctx.fillStyle = theme.floor[0];
  for (const ch of layout.chambers) {
    ctx.beginPath(); ctx.ellipse(ch.x, ch.y, ch.rx, ch.ry, 0, 0, Math.PI * 2); ctx.fill();
  }
  ctx.strokeStyle = theme.floor[0]; ctx.lineWidth = 150;
  for (const [p, q] of roadSegs) {
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.stroke();
  }
  // lighter inner floor
  ctx.fillStyle = theme.floor[1];
  for (const ch of layout.chambers) {
    ctx.beginPath();
    ctx.ellipse(ch.x, ch.y - 8, Math.max(60, ch.rx - 34), Math.max(50, ch.ry - 34), 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.strokeStyle = theme.floor[1]; ctx.lineWidth = 104;
  for (const [p, q] of roadSegs) {
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.stroke();
  }
  // subtle speckle
  ctx.fillStyle = 'rgba(40,35,55,0.18)';
  layout.chambers.forEach((ch, ci) => {
    for (let i = 0; i < 18; i++) {
      const a = i * 2.4 + ci;
      const dx = Math.cos(a) * ch.rx * 0.7 * (((i * 97 + ci * 31) % 100) / 100);
      const dy = Math.sin(a) * ch.ry * 0.7 * (((i * 53 + ci * 13) % 100) / 100);
      ctx.beginPath(); ctx.arc(ch.x + dx, ch.y + dy, 2 + (i % 4), 0, Math.PI * 2); ctx.fill();
    }
  });
  // rocks
  const shades = theme.rockLight;
  const darks  = theme.rockDark;
  for (const r of rocks) {
    ctx.fillStyle = darks[r.shade];
    ctx.beginPath(); ctx.ellipse(r.x, r.y + 8, r.r, r.r * 0.85, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = shades[r.shade];
    ctx.beginPath(); ctx.ellipse(r.x - r.r * 0.12, r.y - r.r * 0.12, r.r * 0.9, r.r * 0.75, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.beginPath(); ctx.ellipse(r.x - r.r * 0.3, r.y - r.r * 0.35, r.r * 0.35, r.r * 0.25, -0.4, 0, Math.PI * 2); ctx.fill();
  }
}

function drawSellPad(t) {
  const pulse = 1 + Math.sin(t * 3) * 0.03;
  ctx.save();
  ctx.translate(sellPad.x, sellPad.y);
  ctx.scale(pulse, pulse);
  ctx.fillStyle = '#4c2b9e';
  rounded(-sellPad.w / 2, -sellPad.h / 2 + 6, sellPad.w, sellPad.h, 18); ctx.fill();
  ctx.fillStyle = '#6a3fd8';
  rounded(-sellPad.w / 2, -sellPad.h / 2, sellPad.w, sellPad.h, 18); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = '900 40px Segoe UI, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('SELL', 0, 2);
  ctx.restore();
}

function drawNextGate(t) {
  if (!allUnlocked()) return;
  const g = layout.gate;

  if (state.level >= LEVELS.length) {
    // final mine cleared — trophy badge, nothing left to buy
    const bob = Math.sin(t * 2) * 4;
    ctx.font = '900 44px Segoe UI, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('👑', g.x, g.y - 26 + bob);
    ctx.font = '900 24px Segoe UI, sans-serif';
    ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(30,18,55,0.85)';
    ctx.strokeText('ALL MINES CLEARED!', g.x, g.y + 22 + bob);
    ctx.fillStyle = '#ffd95e';
    ctx.fillText('ALL MINES CLEARED!', g.x, g.y + 22 + bob);
    return;
  }

  const afford = state.coins >= nextMineCost();
  const pulse = 1 + Math.sin(t * 4) * 0.05;

  // glowing portal ring
  ctx.save();
  ctx.translate(g.x, g.y - 20);
  ctx.scale(pulse, pulse);
  const glow = ctx.createRadialGradient(0, 0, 10, 0, 0, 80);
  glow.addColorStop(0, afford ? 'rgba(255,217,94,0.55)' : 'rgba(180,160,220,0.35)');
  glow.addColorStop(1, 'rgba(255,217,94,0)');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(0, 0, 80, 0, Math.PI * 2); ctx.fill();
  ctx.lineWidth = 7;
  ctx.strokeStyle = afford ? '#ffd95e' : '#9c8fc4';
  ctx.beginPath(); ctx.ellipse(0, 6, 58, 34, 0, 0, Math.PI * 2); ctx.stroke();
  // swirl sparkles
  for (let i = 0; i < 5; i++) {
    const a = t * 2.2 + i * 1.26;
    ctx.fillStyle = 'rgba(255,255,255,' + (0.4 + Math.sin(a * 3) * 0.3) + ')';
    star(Math.cos(a) * 44, 6 + Math.sin(a) * 24, 5); ctx.fill();
  }
  ctx.fillStyle = '#fff';
  ctx.font = '900 22px Segoe UI, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(30,18,55,0.85)';
  ctx.strokeText('NEXT MINE', 0, -46);
  ctx.fillText('NEXT MINE', 0, -46);
  ctx.restore();

  // price tag
  ctx.save();
  ctx.translate(g.x, g.y + 46);
  ctx.fillStyle = afford ? '#6a3fd8' : '#514266';
  rounded(-80, -22, 160, 44, 12); ctx.fill();
  if (afford) {
    ctx.strokeStyle = 'rgba(255,217,94,' + (0.5 + Math.sin(t * 5) * 0.4) + ')';
    ctx.lineWidth = 3;
    rounded(-80, -22, 160, 44, 12); ctx.stroke();
  }
  ctx.fillStyle = '#fff';
  ctx.font = '900 26px Segoe UI, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(fmt(nextMineCost()), 0, 1);
  ctx.restore();
}

function drawPatch(p, t) {
  const unlocked = state.unlocked[p.idx];

  // ore mound
  ctx.globalAlpha = unlocked ? 1 : 0.55;
  const blobs = [[0, -0.12, 1], [-0.55, 0.15, 0.62], [0.55, 0.18, 0.66], [-0.2, 0.4, 0.5], [0.25, 0.42, 0.48]];
  for (const [ox, oy, s] of blobs) {
    ctx.fillStyle = p.moundDark;
    ctx.beginPath(); ctx.ellipse(p.x + ox * p.r, p.y + oy * p.r + 8, p.r * s, p.r * s * 0.7, 0, 0, Math.PI * 2); ctx.fill();
  }
  for (const [ox, oy, s] of blobs) {
    ctx.fillStyle = p.mound;
    ctx.beginPath(); ctx.ellipse(p.x + ox * p.r - 3, p.y + oy * p.r + 2, p.r * s * 0.92, p.r * s * 0.62, 0, 0, Math.PI * 2); ctx.fill();
  }
  // glints on the mound
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  for (let i = 0; i < 8; i++) {
    const a = i * 0.8 + t * 0.3, d = p.r * 0.55;
    const tw = (Math.sin(t * 4 + i * 2) + 1) / 2;
    ctx.globalAlpha = (unlocked ? 0.6 : 0.25) * tw;
    ctx.beginPath(); ctx.arc(p.x + Math.cos(a) * d, p.y + Math.sin(a) * d * 0.6 - 4, 3, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  if (unlocked) {
    // loose tappable gems
    for (const g of p.gems) {
      const bob = Math.sin(t * 3 + g.phase) * 3;
      ctx.fillStyle = 'rgba(0,0,0,0.18)';
      ctx.beginPath(); ctx.ellipse(g.x, g.y + 6, 7, 3.5, 0, 0, Math.PI * 2); ctx.fill();
      drawGem(g.x, g.y + bob - 4, 9, p.color, p.spark);
      const tw = (Math.sin(t * 5 + g.phase * 3) + 1) / 2;
      if (tw > 0.75) {
        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        star(g.x + 6, g.y + bob - 10, 4); ctx.fill();
      }
    }
  } else {
    // gate: pillars + shimmer + lock + price tag
    const gy = p.y + 40;
    ctx.fillStyle = '#3d2a6e';
    rounded(p.x - 86, gy - 100, 22, 110, 6); ctx.fill();
    rounded(p.x + 64, gy - 100, 22, 110, 6); ctx.fill();
    ctx.fillStyle = '#5b3fa8';
    rounded(p.x - 92, gy - 112, 34, 20, 6); ctx.fill();
    rounded(p.x + 58, gy - 112, 34, 20, 6); ctx.fill();
    const shimmer = ctx.createLinearGradient(p.x, gy - 100, p.x, gy + 8);
    shimmer.addColorStop(0, 'rgba(216,180,254,0.15)');
    shimmer.addColorStop(0.5, 'rgba(216,180,254,0.5)');
    shimmer.addColorStop(1, 'rgba(216,180,254,0.2)');
    ctx.fillStyle = shimmer;
    ctx.fillRect(p.x - 64, gy - 100, 128, 108);
    // lock
    const lb = Math.sin(t * 2.5) * 3;
    ctx.fillStyle = '#2b1d52';
    rounded(p.x - 26, gy - 64 + lb, 52, 42, 10); ctx.fill();
    ctx.fillStyle = '#ffd95e';
    rounded(p.x - 22, gy - 60 + lb, 44, 34, 8); ctx.fill();
    ctx.strokeStyle = '#ffd95e'; ctx.lineWidth = 8;
    ctx.beginPath(); ctx.arc(p.x, gy - 62 + lb, 14, Math.PI, 0); ctx.stroke();
    ctx.fillStyle = '#8a6400';
    ctx.beginPath(); ctx.arc(p.x, gy - 46 + lb, 6, 0, Math.PI * 2); ctx.fill();
    // price tag
    const afford = state.coins >= p.cost;
    ctx.save();
    ctx.translate(p.x, gy + 34);
    ctx.rotate(-0.06);
    ctx.fillStyle = afford ? '#6a3fd8' : '#514266';
    rounded(-72, -22, 144, 44, 12); ctx.fill();
    if (afford) {
      ctx.strokeStyle = 'rgba(255,217,94,' + (0.5 + Math.sin(t * 5) * 0.4) + ')';
      ctx.lineWidth = 3;
      rounded(-72, -22, 144, 44, 12); ctx.stroke();
    }
    ctx.fillStyle = '#fff';
    ctx.font = '900 28px Segoe UI, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(fmt(p.cost), 0, 1);
    ctx.restore();
  }
}

function drawGem(x, y, s, color, spark) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x, y - s);
  ctx.lineTo(x + s * 0.85, y - s * 0.2);
  ctx.lineTo(x + s * 0.5, y + s * 0.8);
  ctx.lineTo(x - s * 0.5, y + s * 0.8);
  ctx.lineTo(x - s * 0.85, y - s * 0.2);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = spark;
  ctx.globalAlpha = 0.75;
  ctx.beginPath();
  ctx.moveTo(x, y - s * 0.75);
  ctx.lineTo(x + s * 0.4, y - s * 0.15);
  ctx.lineTo(x, y + s * 0.25);
  ctx.lineTo(x - s * 0.4, y - s * 0.15);
  ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 1;
}

function star(x, y, s) {
  ctx.beginPath();
  ctx.moveTo(x, y - s);
  ctx.quadraticCurveTo(x + s * 0.2, y - s * 0.2, x + s, y);
  ctx.quadraticCurveTo(x + s * 0.2, y + s * 0.2, x, y + s);
  ctx.quadraticCurveTo(x - s * 0.2, y + s * 0.2, x - s, y);
  ctx.quadraticCurveTo(x - s * 0.2, y - s * 0.2, x, y - s);
  ctx.closePath();
}

function drawChest(t) {
  const bounce = Math.abs(Math.sin(chest.t * 4)) * 10;
  const blink = chest.life < 4 && Math.sin(chest.t * 12) > 0;
  ctx.save();
  ctx.translate(chest.x, chest.y - bounce);
  ctx.globalAlpha = blink ? 0.5 : 1;
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath(); ctx.ellipse(0, 34 + bounce, 46, 14, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#b8860b';
  rounded(-44, -6, 88, 42, 10); ctx.fill();
  ctx.fillStyle = '#e6394f';
  rounded(-44, -30, 88, 30, 12); ctx.fill();
  ctx.fillStyle = '#ffd95e';
  rounded(-44, -8, 88, 8, 3); ctx.fill();
  rounded(-8, -30, 16, 44, 4); ctx.fill();
  ctx.fillStyle = '#fff3c4';
  ctx.beginPath(); ctx.arc(0, -2, 5, 0, Math.PI * 2); ctx.fill();
  // sparkles
  for (let i = 0; i < 3; i++) {
    const a = t * 3 + i * 2.1;
    ctx.fillStyle = 'rgba(255,255,255,' + (0.5 + Math.sin(a * 2) * 0.4) + ')';
    star(Math.cos(a) * 55, -38 + Math.sin(a * 1.3) * 12, 5); ctx.fill();
  }
  ctx.restore();
}

function drawMiners(t) {
  const sorted = [...miners].sort((a, b) => a.y - b.y);
  for (const m of sorted) {
    const bob = Math.sin(m.bob) * (m.state === 'mine' ? 2.5 : 1);
    ctx.save();
    ctx.translate(m.x, m.y + bob);
    // selection ring
    if (m.idx === selectedDozer) {
      ctx.strokeStyle = 'rgba(255,255,255,' + (0.55 + Math.sin(t * 5) * 0.3) + ')';
      ctx.lineWidth = 4;
      ctx.beginPath(); ctx.ellipse(0, 12 - bob, 40, 18, 0, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath(); ctx.ellipse(0, 14 - bob, 30, 11, 0, 0, Math.PI * 2); ctx.fill();
    ctx.rotate(m.angle + Math.PI / 2);
    // treads
    ctx.fillStyle = '#3a3344';
    rounded(-24, -20, 10, 44, 5); ctx.fill();
    rounded(14, -20, 10, 44, 5); ctx.fill();
    // body
    ctx.fillStyle = 'hsl(' + m.hue + ', 75%, 55%)';
    rounded(-17, -18, 34, 38, 8); ctx.fill();
    ctx.fillStyle = 'hsl(' + m.hue + ', 75%, 68%)';
    rounded(-13, -14, 26, 18, 6); ctx.fill();
    // blade
    ctx.fillStyle = '#cfd2dd';
    rounded(-22, -30, 44, 9, 4); ctx.fill();
    // cab window
    ctx.fillStyle = '#bfe8ff';
    rounded(-9, 2, 18, 12, 4); ctx.fill();
    // carried load (bots use m.load, the player uses cargo units)
    if (m.load > 0 || m.units > 0) {
      ctx.fillStyle = m.loadColor;
      ctx.beginPath(); ctx.ellipse(0, -26, 16, 9, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.beginPath(); ctx.ellipse(-4, -28, 6, 3, 0, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();

    // player extras drawn upright: name tag + cargo bar
    if (m.isPlayer) {
      const cap = playerCap(state.dozers[0]);
      ctx.font = '900 14px Segoe UI, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(30,18,55,0.85)';
      ctx.strokeText('YOU', m.x, m.y - 56 + bob);
      ctx.fillStyle = '#fff';
      ctx.fillText('YOU', m.x, m.y - 56 + bob);
      if (m.units > 0) {
        const frac = m.units / cap;
        ctx.fillStyle = 'rgba(30,18,55,0.8)';
        rounded(m.x - 24, m.y - 46 + bob, 48, 8, 4); ctx.fill();
        ctx.fillStyle = frac >= 1 ? '#ff6a5c' : frac > 0.66 ? '#ffd95e' : '#8ae05c';
        rounded(m.x - 22, m.y - 44.5 + bob, 44 * frac, 5, 2.5); ctx.fill();
      }
    }
  }
}

function drawJoystick() {
  // screen-space: floating joystick while dragging
  if (!joy || !joy.moved) return;
  const len = Math.hypot(joy.dx, joy.dy) || 1;
  const cl = Math.min(len, 56);
  const kx = joy.sx + joy.dx / len * cl, ky = joy.sy + joy.dy / len * cl;
  ctx.strokeStyle = 'rgba(255,255,255,0.4)';
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(joy.sx, joy.sy, 56, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.12)';
  ctx.beginPath(); ctx.arc(joy.sx, joy.sy, 56, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.65)';
  ctx.beginPath(); ctx.arc(kx, ky, 24, 0, Math.PI * 2); ctx.fill();
}

function drawMinimap(t) {
  const mw = 116, mh = 116, mx = 12, my = 104;
  const ww = worldB.maxX - worldB.minX, wh = worldB.maxY - worldB.minY;
  const s = Math.min(mw / ww, mh / wh);
  const ox = mx + (mw - ww * s) / 2, oy = my + (mh - wh * s) / 2;
  const px = x => ox + (x - worldB.minX) * s;
  const py = y => oy + (y - worldB.minY) * s;
  const theme = currentLevel();

  ctx.fillStyle = 'rgba(15,10,30,0.55)';
  rounded(mx - 6, my - 6, mw + 12, mh + 12, 10); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.25)';
  ctx.lineWidth = 1.5;
  rounded(mx - 6, my - 6, mw + 12, mh + 12, 10); ctx.stroke();

  // roads + chambers
  ctx.strokeStyle = theme.floor[0]; ctx.lineWidth = 4; ctx.lineCap = 'round';
  for (const [a, b] of layout.edges) {
    const p = layout.nodes[a], q = layout.nodes[b];
    ctx.beginPath(); ctx.moveTo(px(p.x), py(p.y)); ctx.lineTo(px(q.x), py(q.y)); ctx.stroke();
  }
  ctx.fillStyle = theme.floor[1];
  for (const ch of layout.chambers) {
    ctx.beginPath(); ctx.ellipse(px(ch.x), py(ch.y), ch.rx * s, ch.ry * s, 0, 0, Math.PI * 2); ctx.fill();
  }
  // ore dots (dim = locked)
  for (const p of patches) {
    ctx.globalAlpha = state.unlocked[p.idx] ? 1 : 0.4;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(px(p.x), py(p.y), 4, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  // sell pad
  ctx.fillStyle = '#8a5cf5';
  rounded(px(sellPad.x) - 4.5, py(sellPad.y) - 3, 9, 6, 2); ctx.fill();
  // portal + chest markers
  if (allUnlocked() && state.level < LEVELS.length) {
    ctx.fillStyle = 'rgba(255,217,94,' + (0.6 + Math.sin(t * 5) * 0.4) + ')';
    star(px(layout.gate.x), py(layout.gate.y), 5); ctx.fill();
  }
  if (chest) {
    ctx.fillStyle = Math.sin(t * 8) > 0 ? '#ffd95e' : '#e6394f';
    ctx.beginPath(); ctx.arc(px(chest.x), py(chest.y), 3.5, 0, Math.PI * 2); ctx.fill();
  }
  // bots then player
  for (const m of miners) {
    if (m.isPlayer) continue;
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.beginPath(); ctx.arc(px(m.x), py(m.y), 2.2, 0, Math.PI * 2); ctx.fill();
  }
  if (miners[0]) {
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = 'rgba(30,18,55,0.9)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(px(miners[0].x), py(miners[0].y), 4, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
  }
  // camera viewport
  ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 1;
  const vw = W / viewScale, vh = H / viewScale;
  ctx.strokeRect(px(cam.x - vw / 2), py(cam.y - vh / 2), vw * s, vh * s);
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 1.6));
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawFloaters() {
  for (const f of floaters) {
    ctx.globalAlpha = Math.max(0, Math.min(1, f.life * 1.5));
    ctx.font = '900 ' + f.size + 'px Segoe UI, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(30,18,55,0.85)';
    ctx.strokeText(f.text, f.x, f.y);
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
}

function drawFlyCoins() {
  // screen-space: arc from world point to the HUD coin counter
  const box = document.getElementById('coinbox').getBoundingClientRect();
  const tx = box.left + box.width / 2, ty = box.top + box.height / 2;
  for (const c of flyCoins) {
    if (c.delay > 0) continue;
    const s0 = worldToScreen(c.x, c.y);
    const sx0 = s0.x, sy0 = s0.y;
    const k = c.t, ease = k * k * (3 - 2 * k);
    const x = sx0 + (tx - sx0) * ease;
    const y = sy0 + (ty - sy0) * ease - Math.sin(k * Math.PI) * 90;
    ctx.fillStyle = '#f5b92b';
    ctx.beginPath(); ctx.arc(x, y, 9, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffd95e';
    ctx.beginPath(); ctx.arc(x, y, 6, 0, Math.PI * 2); ctx.fill();
  }
}

function rounded(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// ============================== Offline earnings ==============================
function offlineEarnings() {
  const away = (Date.now() - state.lastSeen) / 1000;
  if (away < 120) return;
  const capped = Math.min(away, 8 * 3600);
  const avgValue = unlockedPatches().reduce((s, p) => s + p.value, 0) / unlockedPatches().length;
  // every dozer counts as automated while you're away
  const rate = state.dozers.reduce((sum, d) =>
    sum + avgValue * dozerCargo(d) * valueMult() / ((1.4 + 9) / dozerSpeedMult(d)), 0);
  const earned = Math.floor(rate * capped * 0.4);
  if (earned < 1) return;
  const mins = Math.floor(away / 60);
  document.getElementById('toastMsg').textContent =
    'Your miners kept digging for ' + (mins >= 60 ? Math.floor(mins / 60) + 'h ' + (mins % 60) + 'm' : mins + 'm') + ' and earned:  🪙 ' + fmt(earned);
  const toast = document.getElementById('toast');
  toast.style.display = 'block';
  document.getElementById('toastBtn').onclick = () => {
    addCoins(earned);
    toast.style.display = 'none';
    sfx.chest();
    save();
  };
}

// ============================== Main loop ==============================
load();
loadLevel();
offlineEarnings();
refreshShop();

let last = performance.now();
let hudTimer = 0, saveTimer = 0, hintTimer = 12;

function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  const t = now / 1000;

  updatePatches(dt);
  updateMiners(dt);
  updateCamera(dt, false);
  updateChest(dt);
  updateFX(dt);

  hudTimer -= dt;
  if (hudTimer <= 0) {
    hudTimer = 0.15;
    document.getElementById('coins').textContent = fmt(state.coins);
    refreshShop();
  }
  saveTimer -= dt;
  if (saveTimer <= 0) { saveTimer = 5; save(); }
  if (hintTimer > 0) {
    hintTimer -= dt;
    if (hintTimer <= 0) document.getElementById('hint').style.opacity = '0';
  }

  draw(t);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

window.addEventListener('beforeunload', save);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
</script>
